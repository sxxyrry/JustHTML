<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本转二进制 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <script src="../assets/AddHeader_Tools.js"></script>
  <script src="../assets/AddFooter.js"></script>
  <script src="../assets/AddIco.js"></script>

  <style>
    .converter-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .option-item {
      display: flex;
      flex-direction: column;
    }
    
    .option-item label {
      margin-bottom: 5px;
      color: var(--accent-color);
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>文本转二进制</h2>
        <p>将文本转换为二进制数据</p>
        
        <div class="info-box">
          <p><strong>使用说明：</strong></p>
          <p>• 将文本中的每个字符转换为其对应的二进制表示（ASCII码）</p>
          <p>• 每个字符用8位二进制表示（不足8位前面补0）</p>
          <p>• 输出为连续的二进制数字串</p>
        </div>
        
        <div>
          <textarea 
            v-model="inputText" 
            placeholder="在此输入要转换为二进制的文本..."
            rows="8"
          ></textarea>
          
          <div class="controls">
            <button @click="textToBinary">文本转二进制</button>
            <button @click="binaryToText">二进制转文本</button>
            <button @click="clearText">清空</button>
            <button @click="copyResult">复制结果</button>
          </div>
          
          <div class="result" v-if="result">
            <h3>转换结果：</h3>
            <p>{{ result }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const inputText = ref('');
        const result = ref('');

        // 文本转二进制
        const textToBinary = () => {
          if (!inputText.value) {
            result.value = '';
            return;
          }

          try {
            let binary = '';
            
            for (let i = 0; i < inputText.value.length; i++) {
              const charCode = inputText.value.charCodeAt(i);
              const binaryChar = charCode.toString(2).padStart(8, '0');
              binary += binaryChar + ' ';
            }
            
            result.value = binary.trim();
          } catch (error) {
            result.value = `错误: ${error.message}`;
          }
        };

        // 二进制转文本
        const binaryToText = () => {
          if (!inputText.value) {
            result.value = '';
            return;
          }

          try {
            // 移除多余的空格并分割二进制序列
            let binaryStr = inputText.value.replace(/\s+/g, '');
            
            // 验证输入是否只包含0和1
            if (!/^[01\s]+$/.test(inputText.value)) {
              throw new Error('输入包含非二进制字符');
            }

            let text = '';
            
            // 每8位二进制转换为一个字符
            for (let i = 0; i < binaryStr.length; i += 8) {
              const byte = binaryStr.substr(i, 8);
              
              // 检查是否为完整的8位
              if (byte.length < 8) {
                console.warn(`不完整的字节: ${byte}, 忽略`);
                continue;
              }
              
              // 将二进制转换为十进制，然后转换为字符
              const charCode = parseInt(byte, 2);
              text += String.fromCharCode(charCode);
            }
            
            result.value = text;
          } catch (error) {
            result.value = `错误: ${error.message}`;
          }
        };

        const clearText = () => {
          inputText.value = '';
          result.value = '';
        };

        const copyResult = () => {
          if (result.value) {
            navigator.clipboard.writeText(result.value)
              .then(() => {
                alert('已复制到剪贴板！');
              })
              .catch(err => {
                console.error('复制失败: ', err);
                alert('复制失败');
              });
          }
        };

        return {
          inputText,
          result,
          textToBinary,
          binaryToText,
          clearText,
          copyResult
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
