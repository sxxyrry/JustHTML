<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YAML转换器 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>
  <style>
    .converter-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .option-item {
      display: flex;
      flex-direction: column;
    }
    
    .option-item label {
      margin-bottom: 5px;
      color: var(--accent-color);
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
    
    .tab-container {
      margin: 15px 0;
    }
    
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
    }
    
    .tab {
      padding: 10px 15px;
      cursor: pointer;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 5px 5px 0 0;
      margin-right: 5px;
    }
    
    .tab.active {
      background-color: var(--bg-primary);
      border-bottom: 1px solid var(--bg-primary);
      margin-bottom: -1px;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>YAML转换器</h2>
        <p>YAML格式化、验证及与其他格式转换</p>
        
        <div class="info-box">
          <p><strong>功能说明：</strong></p>
          <p>• YAML格式化：美化YAML代码，使其更易读</p>
          <p>• YAML验证：检查YAML语法是否正确</p>
          <p>• YAML转JSON：将YAML数据转换为JSON格式</p>
          <p>• YAML转XML：将YAML数据转换为XML格式</p>
          <p>• YAML转CSV：将YAML数据转换为CSV格式</p>
        </div>
        
        <div class="converter-options">
          <div class="option-item">
            <label for="convertTo">转换为</label>
            <select id="convertTo" v-model="convertTo">
              <option value="format">YAML格式化</option>
              <option value="validate">YAML验证</option>
              <option value="yaml2json">YAML转JSON</option>
              <option value="yaml2xml">YAML转XML</option>
              <option value="yaml2csv">YAML转CSV</option>
            </select>
          </div>
        </div>
        
        <div>
          <textarea 
            v-model="inputYaml" 
            placeholder="在此输入YAML数据..."
            rows="12"
          ></textarea>
          
          <div class="controls">
            <button @click="convertYaml">转换YAML</button>
            <button @click="clearText">清空</button>
            <button @click="copyResult">复制结果</button>
          </div>
          
          <div class="tab-container" v-if="result">
            <div class="tabs">
              <div class="tab" :class="{ active: activeTab === 'result' }" @click="activeTab = 'result'">
                转换结果
              </div>
              <div class="tab" :class="{ active: activeTab === 'preview' }" @click="activeTab = 'preview'" v-if="convertTo === 'yaml2json'">
                格式化预览
              </div>
            </div>
            
            <div class="tab-content" :class="{ active: activeTab === 'result' }">
              <h3>转换结果：</h3>
              <pre>{{ result }}</pre>
            </div>
            
            <div class="tab-content" :class="{ active: activeTab === 'preview' }" v-if="convertTo === 'yaml2json'">
              <h3>格式化预览：</h3>
              <pre>{{ previewResult }}</pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        const inputYaml = ref('');
        const result = ref('');
        const convertTo = ref('format');
        const activeTab = ref('result');

        // 简单的YAML解析器
        const parseYaml = (yamlStr) => {
          // 注意：这是一个简化的YAML解析器，只处理基本的YAML结构
          // 在生产环境中，应该使用成熟的YAML库
          try {
            const lines = yamlStr.split('\n');
            const stack = [{}];
            const root = stack[0];

            for (let line of lines) {
              if (line.trim() === '' || line.trim().startsWith('#')) continue;

              const match = line.match(/^(\s*)(.*?):\s*(.*?)\s*$/);
              if (match) {
                const [, spaces, key, value] = match;
                const depth = spaces.length / 2; // 假设两个空格为一层缩进

                // 调整堆栈到正确深度
                stack.length = depth + 1;

                // 获取当前层级的对象
                const currentObj = stack[depth];
                if (!currentObj) continue;

                // 添加键值对
                if (value) {
                  // 尝试解析值的类型
                  let parsedValue = value;
                  if (value === 'true') parsedValue = true;
                  else if (value === 'false') parsedValue = false;
                  else if (value === 'null' || value === 'Null' || value === 'NULL') parsedValue = null;
                  else if (!isNaN(value) && value.trim() !== '') parsedValue = Number(value);
                  else parsedValue = value.replace(/['"]/g, '');

                  currentObj[key] = parsedValue;
                } else {
                  // 这是一个对象
                  const newObj = {};
                  currentObj[key] = newObj;
                  stack[depth + 1] = newObj;
                }
              } else if (line.match(/^\s*-\s+(.*)/)) {
                // 处理数组元素
                const match = line.match(/^(\s*)-\s+(.*)/);
                if (match) {
                  const [, spaces, value] = match;
                  const depth = spaces.length / 2;
                  const currentObj = stack[depth];
                  
                  if (currentObj) {
                    let parsedValue = value;
                    if (value === 'true') parsedValue = true;
                    else if (value === 'false') parsedValue = false;
                    else if (value === 'null') parsedValue = null;
                    else if (!isNaN(value)) parsedValue = Number(value);
                    else parsedValue = value.replace(/['"]/g, '');

                    if (!Array.isArray(currentObj)) {
                      const arr = [parsedValue];
                      // 将当前对象替换为数组
                      const parent = stack[depth - 1];
                      const lastKey = Object.keys(parent).pop();
                      parent[lastKey] = arr;
                      stack[depth] = arr;
                    } else {
                      currentObj.push(parsedValue);
                    }
                  }
                }
              }
            }

            return root;
          } catch (e) {
            throw new Error(`YAML解析错误: ${e.message}`);
          }
        };

        // YAML格式化（美化）
        const formatYaml = (yaml) => {
          // 由于我们没有完整的YAML解析器，我们只是简单地验证格式并返回
          try {
            parseYaml(yaml);
            return yaml;
          } catch (e) {
            return `格式化错误: ${e.message}`;
          }
        };

        // YAML验证
        const validateYaml = (yaml) => {
          try {
            parseYaml(yaml);
            return 'YAML格式有效';
          } catch (e) {
            return `YAML格式无效: ${e.message}`;
          }
        };

        // YAML转JSON
        const yamlToJson = (yaml) => {
          try {
            const obj = parseYaml(yaml);
            return JSON.stringify(obj, null, 2);
          } catch (e) {
            return `转换错误: ${e.message}`;
          }
        };

        // JSON转XML辅助函数
        const jsonToXml = (obj, level = 0) => {
          let xml = '';
          const indent = '  '.repeat(level);
          
          if (typeof obj === 'object' && obj !== null) {
            if (Array.isArray(obj)) {
              for (const item of obj) {
                xml += `${indent}<item>${typeof item === 'object' ? `\n${jsonToXml(item, level + 1)}${indent}` : item}</item>\n`;
              }
            } else {
              for (const key in obj) {
                const value = obj[key];
                if (typeof value === 'object' && value !== null) {
                  xml += `${indent}<${key}>\n${jsonToXml(value, level + 1)}${indent}</${key}>\n`;
                } else {
                  xml += `${indent}<${key}>${value}</${key}>\n`;
                }
              }
            }
          } else {
            return `${indent}${obj}\n`;
          }
          
          return xml;
        };

        // YAML转XML
        const yamlToXml = (yaml) => {
          try {
            const obj = parseYaml(yaml);
            return `<?xml version="1.0" encoding="UTF-8"?>\n<root>\n${jsonToXml(obj, 1)}</root>`;
          } catch (e) {
            return `转换错误: ${e.message}`;
          }
        };

        // YAML转CSV
        const yamlToCsv = (yaml) => {
          try {
            const obj = parseYaml(yaml);
            
            // 检查是否为数组
            let arr;
            if (Array.isArray(obj)) {
              arr = obj;
            } else if (typeof obj === 'object') {
              // 如果是对象，检查是否包含数组
              arr = Object.values(obj).find(val => Array.isArray(val));
              if (!arr) {
                // 如果没有数组，将对象包装为数组
                arr = [obj];
              }
            } else {
              return '无法转换为CSV：YAML不是数组或对象';
            }
            
            if (!Array.isArray(arr) || arr.length === 0) {
              return '输入必须是非空数组';
            }

            // 获取所有可能的键
            const allKeys = new Set();
            arr.forEach(item => {
              if (typeof item === 'object' && item !== null) {
                Object.keys(item).forEach(key => allKeys.add(key));
              }
            });

            const headers = Array.from(allKeys);
            const csvRows = [headers.join(',')];

            for (const row of arr) {
              const values = headers.map(header => {
                const value = row[header] === null || row[header] === undefined ? '' : row[header];
                // 如果值包含逗号、双引号或换行符，需要用双引号包围
                const strValue = String(value);
                if (strValue.includes(',') || strValue.includes('"') || strValue.includes('\n')) {
                  return `"${strValue.replace(/"/g, '""')}"`;
                }
                return strValue;
              });
              csvRows.push(values.join(','));
            }

            return csvRows.join('\n');
          } catch (e) {
            return `转换错误: ${e.message}`;
          }
        };

        // 执行转换
        const convertYaml = () => {
          if (!inputYaml.value) {
            result.value = '';
            return;
          }

          switch(convertTo.value) {
            case 'format':
              result.value = formatYaml(inputYaml.value);
              break;
            case 'validate':
              result.value = validateYaml(inputYaml.value);
              break;
            case 'yaml2json':
              result.value = yamlToJson(inputYaml.value);
              break;
            case 'yaml2xml':
              result.value = yamlToXml(inputYaml.value);
              break;
            case 'yaml2csv':
              result.value = yamlToCsv(inputYaml.value);
              break;
            default:
              result.value = '请选择正确的转换类型';
          }
        };

        // 清空文本
        const clearText = () => {
          inputYaml.value = '';
          result.value = '';
          activeTab.value = 'result';
        };

        // 复制结果
        const copyResult = () => {
          if (result.value) {
            navigator.clipboard.writeText(result.value)
              .then(() => {
                alert('已复制到剪贴板！');
              })
              .catch(err => {
                console.error('复制失败: ', err);
                alert('复制失败');
              });
          }
        };

        // 预览结果（格式化JSON）
        const previewResult = computed(() => {
          if (convertTo.value === 'yaml2json') {
            try {
              return JSON.stringify(JSON.parse(result.value), null, 2);
            } catch (e) {
              return result.value;
            }
          }
          return '';
        });

        return {
          inputYaml,
          result,
          convertTo,
          activeTab,
          convertYaml,
          clearText,
          copyResult,
          previewResult
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
