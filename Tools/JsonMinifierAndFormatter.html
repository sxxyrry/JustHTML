<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON格式化与压缩工具 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>JSON格式化与压缩工具</h2>
        <p>格式化混乱的JSON数据或将JSON压缩成一行</p>
        
        <div>
          <textarea 
            v-model="inputText" 
            placeholder="在此输入JSON数据..."
            rows="15"
          ></textarea>
          
          <button @click="formatJson">格式化JSON</button>
          <button @click="minifyJson">压缩JSON</button>
          <button @click="validateJson">验证JSON</button>
          <button @click="clearText">清空</button>
          
          <div class="result" v-if="result">
            <p><strong>结果:</strong></p>
            <pre>{{ result }}</pre>
          </div>
          
          <div class="result" v-if="error" style="color: #ff6b6b;">
            <p><strong>错误:</strong></p>
            <p>{{ error }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const inputText = ref('');
        const result = ref('');
        const error = ref('');

        const formatJson = () => {
          error.value = '';
          try {
            const parsed = JSON.parse(inputText.value);
            result.value = JSON.stringify(parsed, null, 2);
          } catch (e) {
            error.value = `JSON格式错误: ${e.message}`;
          }
        };

        const minifyJson = () => {
          error.value = '';
          try {
            const parsed = JSON.parse(inputText.value);
            result.value = JSON.stringify(parsed);
          } catch (e) {
            error.value = `JSON格式错误: ${e.message}`;
          }
        };

        const validateJson = () => {
          error.value = '';
          result.value = '';
          try {
            JSON.parse(inputText.value);
            result.value = '✓ JSON格式有效';
          } catch (e) {
            error.value = `JSON格式错误: ${e.message}`;
          }
        };

        const clearText = () => {
          inputText.value = '';
          result.value = '';
          error.value = '';
        };

        return {
          inputText,
          result,
          error,
          formatJson,
          minifyJson,
          validateJson,
          clearText
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
