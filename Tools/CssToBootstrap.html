<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS转Bootstrap工具 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>
  <style>
    .converter-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    .converter-section {
      display: flex;
      flex-direction: column;
    }
    
    .converter-section textarea {
      flex: 1;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
    
    .conversion-info {
      background-color: var(--bg-tertiary);
      padding: 15px;
      border-radius: var(--border-radius);
      margin: 15px 0;
    }
    
    .conversion-item {
      margin: 8px 0;
      padding: 5px 0;
      border-bottom: 1px solid var(--bg-primary);
    }
    
    .mapping {
      display: flex;
      justify-content: space-between;
    }
    
    .css-prop {
      color: #ff6b6b;
      font-family: monospace;
    }
    
    .bootstrap-class {
      color: #4a9eff;
      font-family: monospace;
    }
    
    @media (max-width: 768px) {
      .converter-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>CSS转Bootstrap工具</h2>
        <p>将CSS样式转换为相应的Bootstrap类名</p>
        
        <div class="info-box">
          <p><strong>功能说明：</strong></p>
          <p>• 将常见的CSS样式转换为Bootstrap类名</p>
          <p>• 支持布局、间距、颜色、文本等常用样式转换</p>
          <p>• 保留无法转换的自定义样式</p>
        </div>
        
        <div class="conversion-info">
          <h3>支持的转换映射</h3>
          <div class="conversion-item">
            <div class="mapping">
              <span class="css-prop">margin: 10px;</span> → <span class="bootstrap-class">m-3</span>
            </div>
            <div class="mapping">
              <span class="css-prop">padding: 20px;</span> → <span class="bootstrap-class">p-4</span>
            </div>
            <div class="mapping">
              <span class="css-prop">display: flex;</span> → <span class="bootstrap-class">d-flex</span>
            </div>
            <div class="mapping">
              <span class="css-prop">text-align: center;</span> → <span class="bootstrap-class">text-center</span>
            </div>
          </div>
        </div>
        
        <div class="converter-container">
          <div class="converter-section">
            <h3>原始CSS</h3>
            <textarea 
              v-model="inputCss" 
              placeholder="在此输入CSS代码..."
              rows="15"
            ></textarea>
          </div>
          
          <div class="converter-section">
            <h3>转换后的HTML</h3>
            <textarea 
              v-model="convertedHtml" 
              placeholder="转换后的HTML将在这里显示"
              rows="15"
              readonly
            ></textarea>
          </div>
        </div>
        
        <div class="controls">
          <button @click="convertCssToBootstrap">转换为Bootstrap</button>
          <button @click="clearAll">清空</button>
          <button @click="copyResult">复制结果</button>
          <button @click="loadExample">加载示例</button>
        </div>
        
        <div class="result" v-if="resultMessage">
          {{ resultMessage }}
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const inputCss = ref('');
        const convertedHtml = ref('');
        const resultMessage = ref('');
        
        // CSS到Bootstrap类的映射
        const cssToBootstrapMap = {
          'display': {
            'flex': 'd-flex',
            'inline-flex': 'd-inline-flex',
            'block': 'd-block',
            'inline': 'd-inline',
            'inline-block': 'd-inline-block',
            'none': 'd-none'
          },
          'text-align': {
            'center': 'text-center',
            'left': 'text-start',
            'right': 'text-end',
            'justify': 'text-justify'
          },
          'float': {
            'left': 'float-start',
            'right': 'float-end',
            'none': 'float-none'
          },
          'position': {
            'static': 'position-static',
            'relative': 'position-relative',
            'absolute': 'position-absolute',
            'fixed': 'position-fixed',
            'sticky': 'position-sticky'
          },
          'text-transform': {
            'uppercase': 'text-uppercase',
            'lowercase': 'text-lowercase',
            'capitalize': 'text-capitalize'
          },
          'font-weight': {
            'bold': 'fw-bold',
            'normal': 'fw-normal',
            'lighter': 'fw-lighter',
            'bolder': 'fw-bolder'
          },
          'font-style': {
            'italic': 'fst-italic',
            'normal': 'fst-normal'
          },
          'vertical-align': {
            'top': 'align-top',
            'middle': 'align-middle',
            'bottom': 'align-bottom',
            'baseline': 'align-baseline'
          }
        };
        
        // 边距和填充映射
        const spacingMap = {
          'margin': 'm',
          'padding': 'p'
        };
        
        // 处理边距和填充
        const handleSpacing = (prop, value) => {
          // 简单的数值到Bootstrap间距映射
          const sizeMap = {
            '0': 0,
            '0.25rem': 1,
            '0.5rem': 2,
            '1rem': 3,
            '1.5rem': 4,
            '3rem': 5
          };
          
          // 简化处理，实际使用中可以更复杂
          if (value.includes('px')) {
            const num = parseInt(value);
            if (num <= 5) return `${spacingMap[prop]}-1`;
            if (num <= 10) return `${spacingMap[prop]}-2`;
            if (num <= 15) return `${spacingMap[prop]}-3`;
            if (num <= 20) return `${spacingMap[prop]}-4`;
            return `${spacingMap[prop]}-5`;
          }
          return null;
        };
        
        // 转换CSS到Bootstrap
        const convertCssToBootstrap = () => {
          if (!inputCss.value.trim()) {
            convertedHtml.value = '';
            resultMessage.value = '请输入CSS代码';
            return;
          }
          
          try {
            // 解析CSS
            const classes = [];
            const customStyles = [];
            
            // 提取CSS规则
            const cssRules = parseCss(inputCss.value);
            
            // 遍历规则并转换
            for (const rule of cssRules) {
              if (rule.type === 'rule') {
                const selector = rule.selector;
                const bootstrapClasses = [];
                
                // 遍历声明
                for (const decl of rule.declarations) {
                  const prop = decl.property;
                  const value = decl.value;
                  
                  // 检查是否在映射中
                  if (cssToBootstrapMap[prop] && cssToBootstrapMap[prop][value]) {
                    bootstrapClasses.push(cssToBootstrapMap[prop][value]);
                  } else if ((prop === 'margin' || prop === 'padding') && value) {
                    const bsClass = handleSpacing(prop, value);
                    if (bsClass) {
                      bootstrapClasses.push(bsClass);
                    } else {
                      customStyles.push(`${prop}: ${value};`);
                    }
                  } else {
                    customStyles.push(`${prop}: ${value};`);
                  }
                }
                
                // 生成HTML示例
                let tag = 'div';
                if (selector.startsWith('.')) {
                  tag = 'div';
                } else if (selector.startsWith('#')) {
                  tag = 'div';
                } else {
                  tag = selector;
                }
                
                const classAttr = bootstrapClasses.length > 0 ? ` class="${bootstrapClasses.join(' ')}"` : '';
                const styleAttr = customStyles.length > 0 ? ` style="${customStyles.join(' ')}"` : '';
                
                convertedHtml.value = `<${tag}${classAttr}${styleAttr}>\n  <!-- 内容 -->\n</${tag}>`;
              }
            }
            
            if (!convertedHtml.value) {
              resultMessage.value = '未能转换CSS规则，请检查格式';
            } else {
              resultMessage.value = '转换完成！';
            }
          } catch (error) {
            resultMessage.value = `转换失败: ${error.message}`;
          }
        };
        
        // 简单的CSS解析器
        const parseCss = (cssText) => {
          const rules = [];
          // 移除注释
          cssText = cssText.replace(/\/\*[\s\S]*?\*\//g, '');
          
          // 匹配规则
          const ruleRegex = /([^{]+)\{([^}]*)\}/g;
          let match;
          
          while ((match = ruleRegex.exec(cssText)) !== null) {
            const selector = match[1].trim();
            const declarationsText = match[2].trim();
            
            const declarations = [];
            const declRegex = /([\w\-]+)\s*:\s*([^;]+);?/g;
            let declMatch;
            
            while ((declMatch = declRegex.exec(declarationsText)) !== null) {
              const property = declMatch[1].trim();
              const value = declMatch[2].trim();
              declarations.push({ property, value });
            }
            
            rules.push({
              type: 'rule',
              selector,
              declarations
            });
          }
          
          return rules;
        };
        
        // 清空所有内容
        const clearAll = () => {
          inputCss.value = '';
          convertedHtml.value = '';
          resultMessage.value = '';
        };
        
        // 复制结果到剪贴板
        const copyResult = async () => {
          if (!convertedHtml.value) {
            resultMessage.value = '没有可复制的内容';
            return;
          }
          
          try {
            await navigator.clipboard.writeText(convertedHtml.value);
            resultMessage.value = '已复制到剪贴板';
          } catch (error) {
            resultMessage.value = '复制失败，请手动复制';
          }
        };
        
        // 加载示例
        const loadExample = () => {
          inputCss.value = `.my-element {
  display: flex;
  text-align: center;
  margin: 20px;
  padding: 10px;
  font-weight: bold;
}`;
          convertCssToBootstrap(); // 自动转换示例
        };
        
        return {
          inputCss,
          convertedHtml,
          resultMessage,
          convertCssToBootstrap,
          clearAll,
          copyResult,
          loadExample
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
