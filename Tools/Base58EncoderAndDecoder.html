<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base58编码/解码工具 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <script src="../assets/AddHeader.js"></script>
  <script src="../assets/AddFooter.js"></script>

</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>Base58编码/解码工具</h2>
        <p>将文本转换为Base58编码或将Base58编码解码为原文本</p>
        
        <div>
          <textarea 
            v-model="inputText" 
            placeholder="在此输入要编码或解码的文本..."
            rows="8"
          ></textarea>
          
          <button @click="encodeBase58">Base58编码</button>
          <button @click="decodeBase58">Base58解码</button>
          <button @click="clearText">清空</button>
          
          <div class="result" v-if="result">
            <p><strong>结果:</strong></p>
            <pre>{{ result }}</pre>
          </div>
          
          <div class="result" v-if="error" style="color: #ff6b6b;">
            <p><strong>错误:</strong></p>
            <p>{{ error }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const inputText = ref('');
        const result = ref('');
        const error = ref('');
        
        // Base58字符表 (Bitcoin使用的标准)
        const BASE58_CHARS = "123456789ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
        
        // Base58编码函数
        const encodeBase58 = () => {
          error.value = '';
          try {
            result.value = base58Encode(inputText.value);
          } catch (e) {
            error.value = `编码失败: ${e.message}`;
          }
        };
        
        // Base58解码函数
        const decodeBase58 = () => {
          error.value = '';
          try {
            result.value = base58Decode(inputText.value);
          } catch (e) {
            error.value = `解码失败: ${e.message}`;
          }
        };
        
        // Base58编码实现
        function base58Encode(str) {
          if (str === "") return "";
          
          // 将字符串转换为字节数组
          const bytes = new TextEncoder().encode(str);
          
          if (bytes.length === 0) return '';
          
          // 计算前导零的数量
          let leadingZeros = 0;
          while (leadingZeros < bytes.length && bytes[leadingZeros] === 0) {
            leadingZeros++;
          }
          
          // 转换为Base58
          let digits = [0];
          for (let i = leadingZeros; i < bytes.length; i++) {
            let carry = bytes[i];
            for (let j = 0; j < digits.length; ++j) {
              carry += digits[j] << 8; // digits[j] * 256
              digits[j] = carry % 58;
              carry = (carry / 58) | 0; // Math.floor(carry / 58)
            }
            
            while (carry > 0) {
              digits.push(carry % 58);
              carry = (carry / 58) | 0;
            }
          }
          
          // 添加前导零对应的'1'
          let encoded = '';
          for (let i = 0; i < leadingZeros; i++) {
            encoded += '1';
          }
          
          // 添加编码字符
          for (let i = digits.length - 1; i >= 0; i--) {
            encoded += BASE58_CHARS[digits[i]];
          }
          
          return encoded;
        }
        
        // Base58解码实现
        function base58Decode(str) {
          if (str === "") return "";
          
          // 验证Base58字符
          if (/[^1-9A-HJ-NP-Za-km-z]/.test(str)) {
            throw new Error("输入包含无效的Base58字符");
          }
          
          // 计算前导'1'的数量（对应前导零）
          let leadingOnes = 0;
          while (leadingOnes < str.length && str[leadingOnes] === '1') {
            leadingOnes++;
          }
          
          // 将Base58转换为字节
          let bytes = [0];
          for (let i = leadingOnes; i < str.length; i++) {
            let carry = BASE58_CHARS.indexOf(str[i]);
            if (carry < 0) {
              throw new Error("无效的Base58字符");
            }
            
            for (let j = 0; j < bytes.length; ++j) {
              carry += bytes[j] * 58;
              bytes[j] = carry & 0xff; // carry % 256
              carry >>= 8; // Math.floor(carry / 256)
            }
            
            while (carry > 0) {
              bytes.push(carry & 0xff);
              carry >>= 8;
            }
          }
          
          // 反转字节数组
          bytes.reverse();
          
          // 添加前导零
          const resultBytes = new Uint8Array(leadingOnes + bytes.length);
          for (let i = 0; i < bytes.length; i++) {
            resultBytes[leadingOnes + i] = bytes[i];
          }
          
          // 尝试将字节数组转换为字符串
          try {
            return new TextDecoder().decode(resultBytes);
          } catch (e) {
            throw new Error(`解码错误: ${e.message}`);
          }
        }
        
        const clearText = () => {
          inputText.value = '';
          result.value = '';
          error.value = '';
        };

        return {
          inputText,
          result,
          error,
          encodeBase58,
          decodeBase58,
          clearText
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
