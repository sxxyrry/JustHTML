<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本反转器 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}

/**
 * 动态加载（强制去除缓存） JS 的函数
 * @param {string} src - 要加载的 JS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    script.async = true;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
    let scriptArray = [
      "../assets/AddHeader_Tools.js",
      "../assets/AddFooter.js",
      "../assets/AddIco.js",
      "../assets/AutoRun.js",
    ]

    scriptArray.forEach(script => {
      loadScript(script);
    });
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <style>
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
    
    .transform-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .option-item {
      display: flex;
      flex-direction: column;
    }
    
    .option-item label {
      margin-bottom: 5px;
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>文本反转器</h2>
        <p>反转文本内容</p>
        
        <div class="info-box">
          <p><strong>功能说明：</strong></p>
          <p>• 字符反转：将文本中的每个字符顺序颠倒</p>
          <p>• 单词反转：将文本中的单词顺序颠倒</p>
          <p>• 行反转：将多行文本的行顺序颠倒</p>
        </div>
        
        <div class="transform-options">
          <div class="option-item">
            <label for="transformType">反转类型</label>
            <select id="transformType" v-model="transformType">
              <option value="char">字符反转</option>
              <option value="word">单词反转</option>
              <option value="line">行反转</option>
            </select>
          </div>
        </div>
        
        <div>
          <textarea 
            v-model="inputText" 
            placeholder="在此输入要反转的文本..."
            rows="10"
          ></textarea>
          
          <div class="controls">
            <button @click="reverseText">反转文本</button>
            <button @click="clearText">清空</button>
            <button @click="copyResult">复制结果</button>
          </div>
          
          <div class="result" v-if="result">
            <h3>反转结果：</h3>
            <pre>{{ result }}</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const inputText = ref('');
        const result = ref('');
        const transformType = ref('char');

        // 反转文本
        const reverseText = () => {
          if (!inputText.value) {
            result.value = '';
            return;
          }

          switch(transformType.value) {
            case 'char':
              // 字符反转：完全颠倒所有字符
              result.value = inputText.value.split('').reverse().join('');
              break;
              
            case 'word':
              // 单词反转：按单词为单位颠倒顺序
              // 将文本按空白字符分割成单词，反转顺序后再连接
              const words = inputText.value.split(/(\s+)/);
              result.value = words.reverse().join('');
              break;
              
            case 'line':
              // 行反转：按行为单位颠倒顺序
              const lines = inputText.value.split('\n');
              result.value = lines.reverse().join('\n');
              break;
              
            default:
              result.value = inputText.value;
          }
        };

        // 清空文本
        const clearText = () => {
          inputText.value = '';
          result.value = '';
        };

        // 复制结果
        const copyResult = () => {
          if (result.value) {
            navigator.clipboard.writeText(result.value)
              .then(() => {
                alert('已复制到剪贴板！');
              })
              .catch(err => {
                console.error('复制失败: ', err);
                alert('复制失败');
              });
          }
        };

        return {
          inputText,
          result,
          transformType,
          reverseText,
          clearText,
          copyResult
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
