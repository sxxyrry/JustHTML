<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片滤镜工具 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}

/**
 * 动态加载（强制去除缓存） JS 的函数
 * @param {string} src - 要加载的 JS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    script.async = true;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
    let scriptArray = [
      "../assets/AddHeader_Tools.js",
      "../assets/AddFooter.js",
      "../assets/AddIco.js",
      "../assets/AutoRun.js",
    ]

    scriptArray.forEach(script => {
      loadScript(script);
    });
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <style>
    .filter-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .control-item {
      display: flex;
      flex-direction: column;
    }
    
    .control-item label {
      margin-bottom: 5px;
      color: var(--accent-color);
    }
    
    .control-item input, .control-item select {
      padding: 8px;
    }
    
    .image-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }
    
    .image-preview {
      flex: 1;
      min-width: 300px;
      text-align: center;
    }
    
    .image-preview img {
      max-width: 100%;
      max-height: 400px;
      display: block;
      margin: 0 auto;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .filter-presets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin: 15px 0;
    }
    
    .preset-btn {
      padding: 10px;
      background-color: var(--bg-secondary);
      border-radius: var(--border-radius);
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .preset-btn:hover {
      background-color: var(--bg-tertiary);
    }
    
    .preset-btn.selected {
      background-color: var(--accent-color);
      color: white;
    }
    
    .slider-container {
      margin: 10px 0;
    }
    
    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>图片滤镜工具</h2>
        <p>为图片添加各种滤镜效果</p>
        
        <div class="info-box">
          <p><strong>使用说明：</strong></p>
          <p>• 上传图片后，调整各种滤镜参数或选择预设效果</p>
          <p>• 实时预览滤镜效果</p>
          <p>• 处理完成后点击"下载图片"按钮保存</p>
        </div>
        
        <div>
          <input type="file" @change="handleFileUpload" accept="image/*" />
          
          <div class="filter-presets">
            <div 
              class="preset-btn" 
              :class="{ selected: selectedPreset === preset.name }"
              v-for="preset in presets" 
              :key="preset.name"
              @click="applyPreset(preset)"
            >
              {{ preset.name }}
            </div>
          </div>
          
          <div class="filter-controls">
            <div class="control-item">
              <label for="brightness">亮度</label>
              <input 
                type="range" 
                id="brightness" 
                v-model.number="filters.brightness" 
                min="0" 
                max="200" 
                step="1"
              />
              <span>{{ filters.brightness }}%</span>
            </div>
            
            <div class="control-item">
              <label for="contrast">对比度</label>
              <input 
                type="range" 
                id="contrast" 
                v-model.number="filters.contrast" 
                min="0" 
                max="200" 
                step="1"
              />
              <span>{{ filters.contrast }}%</span>
            </div>
            
            <div class="control-item">
              <label for="saturation">饱和度</label>
              <input 
                type="range" 
                id="saturation" 
                v-model.number="filters.saturation" 
                min="0" 
                max="200" 
                step="1"
              />
              <span>{{ filters.saturation }}%</span>
            </div>
            
            <div class="control-item">
              <label for="hueRotate">色调旋转</label>
              <input 
                type="range" 
                id="hueRotate" 
                v-model.number="filters.hueRotate" 
                min="0" 
                max="360" 
                step="1"
              />
              <span>{{ filters.hueRotate }}°</span>
            </div>
          </div>
          
          <div class="slider-container">
            <div class="slider-label">
              <span>模糊度: {{ filters.blur }}px</span>
              <input 
                type="range" 
                v-model.number="filters.blur" 
                min="0" 
                max="20" 
                step="0.1"
              />
            </div>
          </div>
          
          <div class="slider-container">
            <div class="slider-label">
              <span>透明度: {{ filters.opacity }}%</span>
              <input 
                type="range" 
                v-model.number="filters.opacity" 
                min="0" 
                max="100" 
                step="1"
              />
            </div>
          </div>
          
          <div class="controls">
            <button @click="resetFilters">重置滤镜</button>
            <button @click="downloadImage" :disabled="!filteredImage">下载图片</button>
          </div>
          
          <div class="image-container" v-if="originalImage">
            <div class="image-preview">
              <h3>原始图片</h3>
              <img :src="originalImage" alt="Original Image" />
            </div>
            
            <div class="image-preview" v-if="filteredImage">
              <h3>滤镜效果</h3>
              <img 
                :src="filteredImage" 
                alt="Filtered Image"
                :style="getImageStyle"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        const originalImage = ref('');
        const filteredImage = ref('');
        const selectedPreset = ref('');
        
        const filters = ref({
          brightness: 100,
          contrast: 100,
          saturation: 100,
          hueRotate: 0,
          blur: 0,
          opacity: 100
        });
        
        const presets = [
          { name: '无效果', values: { brightness: 100, contrast: 100, saturation: 100, hueRotate: 0, blur: 0, opacity: 100 } },
          { name: '黑白', values: { brightness: 100, contrast: 120, saturation: 0, hueRotate: 0, blur: 0, opacity: 100 } },
          { name: '复古', values: { brightness: 90, contrast: 110, saturation: 120, hueRotate: 30, blur: 0, opacity: 100 } },
          { name: '冷色调', values: { brightness: 100, contrast: 100, saturation: 120, hueRotate: 180, blur: 0, opacity: 100 } },
          { name: '暖色调', values: { brightness: 110, contrast: 110, saturation: 130, hueRotate: 330, blur: 0, opacity: 100 } },
          { name: '模糊', values: { brightness: 100, contrast: 100, saturation: 100, hueRotate: 0, blur: 5, opacity: 100 } },
          { name: '高对比', values: { brightness: 100, contrast: 150, saturation: 120, hueRotate: 0, blur: 0, opacity: 100 } },
          { name: '昏暗', values: { brightness: 70, contrast: 90, saturation: 80, hueRotate: 0, blur: 0, opacity: 100 } }
        ];

        const handleFileUpload = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = (e) => {
            originalImage.value = e.target.result;
            selectedPreset.value = '无效果';
          };
          reader.readAsDataURL(file);
        };

        const getImageStyle = computed(() => {
          return {
            filter: `
              brightness(${filters.value.brightness}%)
              contrast(${filters.value.contrast}%)
              saturate(${filters.value.saturation}%)
              hue-rotate(${filters.value.hueRotate}deg)
              blur(${filters.value.blur}px)
              opacity(${filters.value.opacity}%)
            `
          };
        });

        const applyPreset = (preset) => {
          filters.value = { ...preset.values };
          selectedPreset.value = preset.name;
        };

        const resetFilters = () => {
          filters.value = {
            brightness: 100,
            contrast: 100,
            saturation: 100,
            hueRotate: 0,
            blur: 0,
            opacity: 100
          };
          selectedPreset.value = '无效果';
        };

        const downloadImage = () => {
          if (!filteredImage.value) return;
          
          const link = document.createElement('a');
          link.href = filteredImage.value;
          link.download = 'filtered_image.jpg';
          link.click();
        };

        return {
          originalImage,
          filteredImage,
          filters,
          presets,
          selectedPreset,
          getImageStyle,
          handleFileUpload,
          applyPreset,
          resetFilters,
          downloadImage
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
