<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掷骰子 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <script src="../assets/AddHeader_Tools.js"></script>
  <script src="../assets/AddFooter.js"></script>
  <script src="../assets/AddIco.js"></script>

  <style>
    .dice-roller {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }
    
    .dice-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    
    .dice {
      width: 80px;
      height: 80px;
      background-color: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      position: relative;
      transition: transform 0.3s ease;
    }
    
    .dice.rolling {
      animation: roll 0.5s ease infinite;
    }
    
    @keyframes roll {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    
    .settings {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }
    
    .setting-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .setting-item input {
      width: 80px;
      padding: 5px;
      text-align: center;
    }
    
    .setting-item label {
      margin-top: 5px;
      font-size: 0.9em;
      color: var(--accent-color);
    }
    
    .results-history {
      margin-top: 30px;
      padding: 15px;
      background-color: var(--bg-tertiary);
      border-radius: var(--border-radius);
    }
    
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    
    .history-item {
      padding: 8px;
      background-color: var(--bg-secondary);
      border-radius: var(--border-radius);
      text-align: center;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    
    .stat-item {
      padding: 10px;
      background-color: var(--bg-secondary);
      border-radius: var(--border-radius);
      text-align: center;
    }
    
    .dice-result {
      font-size: 2em;
      font-weight: bold;
      margin: 10px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section dice-roller">
        <h2>掷骰子</h2>
        <p>虚拟骰子模拟器</p>
        
        <div class="info-box">
          <p><strong>使用说明：</strong></p>
          <p>• 设置骰子数量和面数</p>
          <p>• 点击"掷骰子"按钮进行投掷</p>
          <p>• 查看历史记录和统计信息</p>
        </div>
        
        <div>
          <div class="dice-container">
            <div 
              v-for="(die, index) in diceResults" 
              :key="index" 
              class="dice"
              :class="{ rolling: isRolling }"
            >
              {{ die }}
            </div>
          </div>
          
          <div class="dice-result" v-if="diceResults.length > 1">
            总和: {{ totalSum }}
          </div>
          
          <div class="settings">
            <div class="setting-item">
              <input 
                type="number" 
                v-model.number="diceCount" 
                min="1" 
                max="10" 
                :disabled="isRolling"
              >
              <label>骰子数量</label>
            </div>
            
            <div class="setting-item">
              <input 
                type="number" 
                v-model.number="diceFaces" 
                min="2" 
                max="100" 
                :disabled="isRolling"
              >
              <label>骰子面数</label>
            </div>
          </div>
          
          <div class="controls">
            <button @click="rollDice" :disabled="isRolling">掷骰子</button>
            <button @click="clearHistory">清空历史</button>
          </div>
          
          <div class="results-history" v-if="history.length > 0">
            <h3>历史记录</h3>
            <div class="history-grid">
              <div 
                v-for="(record, index) in displayedHistory" 
                :key="index" 
                class="history-item"
                :title="`投掷时间: ${new Date(record.timestamp).toLocaleString()}`"
              >
                {{ record.sum }}
              </div>
            </div>
            
            <div class="stats">
              <div class="stat-item">
                <div>总投掷次数</div>
                <div>{{ history.length }}</div>
              </div>
              <div class="stat-item">
                <div>最高分</div>
                <div>{{ maxScore }}</div>
              </div>
              <div class="stat-item">
                <div>最低分</div>
                <div>{{ minScore }}</div>
              </div>
              <div class="stat-item">
                <div>平均分</div>
                <div>{{ avgScore }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        const diceCount = ref(2);
        const diceFaces = ref(6);
        const diceResults = ref([]);
        const isRolling = ref(false);
        const history = ref([]);
        
        // 限制历史记录数量
        const MAX_HISTORY = 50;

        // 计算总和
        const totalSum = computed(() => {
          return diceResults.value.reduce((sum, val) => sum + val, 0);
        });

        // 显示的历史记录（最多20个）
        const displayedHistory = computed(() => {
          return history.value.slice(-20);
        });

        // 最高分
        const maxScore = computed(() => {
          if (history.value.length === 0) return 0;
          return Math.max(...history.value.map(h => h.sum));
        });

        // 最低分
        const minScore = computed(() => {
          if (history.value.length === 0) return 0;
          return Math.min(...history.value.map(h => h.sum));
        });

        // 平均分
        const avgScore = computed(() => {
          if (history.value.length === 0) return 0;
          const sum = history.value.reduce((acc, h) => acc + h.sum, 0);
          return (sum / history.value.length).toFixed(1);
        });

        // 掷骰子
        const rollDice = async () => {
          isRolling.value = true;
          
          // 模拟滚动动画
          await new Promise(resolve => setTimeout(resolve, 500));
          
          // 生成随机数
          diceResults.value = [];
          for (let i = 0; i < diceCount.value; i++) {
            const result = Math.floor(Math.random() * diceFaces.value) + 1;
            diceResults.value.push(result);
          }
          
          // 添加到历史记录
          history.value.push({
            rolls: [...diceResults.value],
            sum: totalSum.value,
            timestamp: Date.now()
          });
          
          // 限制历史记录数量
          if (history.value.length > MAX_HISTORY) {
            history.value.shift();
          }
          
          isRolling.value = false;
        };

        // 清空历史记录
        const clearHistory = () => {
          history.value = [];
          diceResults.value = [];
        };

        return {
          diceCount,
          diceFaces,
          diceResults,
          isRolling,
          history,
          displayedHistory,
          totalSum,
          maxScore,
          minScore,
          avgScore,
          rollDice,
          clearHistory
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
