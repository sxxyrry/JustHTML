<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON到XML转换工具 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <script src="../assets/AddHeader.js"></script>
  <script src="../assets/AddFooter.js"></script>

  <style>
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>JSON到XML转换工具</h2>
        <p>在JSON和XML格式之间相互转换</p>
        
        <div class="info-box">
          <p><strong>使用说明：</strong></p>
          <p>将JSON数据转换为XML格式，或将XML转换为JSON</p>
        </div>
        
        <div>
          <textarea 
            v-model="inputText" 
            placeholder='在此输入JSON或XML数据...'
            rows="15"
          ></textarea>
          
          <div class="controls">
            <button @click="convertJsonToXml">JSON → XML</button>
            <button @click="convertXmlToJson">XML → JSON</button>
            <button @click="validateJson">验证JSON</button>
            <button @click="clearText">清空</button>
          </div>
          
          <div class="result" v-if="result">
            <p><strong>结果:</strong></p>
            <pre>{{ result }}</pre>
          </div>
          
          <div class="result" v-if="error" style="color: #ff6b6b;">
            <p><strong>错误:</strong></p>
            <p>{{ error }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const inputText = ref('');
        const result = ref('');
        const error = ref('');

        const convertJsonToXml = () => {
          error.value = '';
          if (!inputText.value) {
            result.value = '';
            return;
          }

          try {
            const jsonData = JSON.parse(inputText.value);
            result.value = jsonToXml(jsonData, 0);
          } catch (e) {
            error.value = `JSON解析错误: ${e.message}`;
          }
        };

        const jsonToXml = (obj, depth) => {
          const indent = '  '.repeat(depth);
          let xmlStr = '';

          if (obj === null) {
            return `${indent}null`;
          }

          if (Array.isArray(obj)) {
            if (obj.length === 0) {
              return `${indent}<array></array>`;
            }
            
            for (let i = 0; i < obj.length; i++) {
              const value = obj[i];
              const tag = isNumeric(value) ? 'number' : 'item';
              
              if (value !== null && typeof value === 'object') {
                xmlStr += `${indent}<${tag}>\n${jsonToXml(value, depth + 1)}\n${indent}</${tag}>\n`;
              } else {
                const escapedValue = escapeXml(value);
                xmlStr += `${indent}<${tag}>${escapedValue}</${tag}>\n`;
              }
            }
          } else if (typeof obj === 'object' && obj !== null) {
            const keys = Object.keys(obj);
            
            for (let i = 0; i < keys.length; i++) {
              const key = sanitizeXmlTag(keys[i]);
              const value = obj[keys[i]];
              
              if (value !== null && typeof value === 'object') {
                if (Array.isArray(value)) {
                  if (value.length === 0) {
                    xmlStr += `${indent}<${key}></${key}>\n`;
                  } else {
                    xmlStr += `${indent}<${key}>\n${jsonToXml(value, depth + 1)}${indent}</${key}>\n`;
                  }
                } else {
                  xmlStr += `${indent}<${key}>\n${jsonToXml(value, depth + 1)}\n${indent}</${key}>\n`;
                }
              } else {
                const escapedValue = escapeXml(value);
                xmlStr += `${indent}<${key}>${escapedValue}</${key}>\n`;
              }
            }
          } else {
            xmlStr = escapeXml(obj);
          }

          return xmlStr;
        };

        const escapeXml = (value) => {
          if (value === null || value === undefined) {
            return '';
          }
          
          return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&apos;');
        };

        const sanitizeXmlTag = (tagName) => {
          // XML标签名称不能以数字或特殊字符开头
          tagName = tagName.replace(/^[^a-zA-Z_:]|[^a-zA-Z0-9_:.\\-]/g, '_');
          if (!tagName) {
            tagName = 'element';
          }
          return tagName;
        };

        const isNumeric = (value) => {
          return !isNaN(parseFloat(value)) && isFinite(value);
        };

        const convertXmlToJson = () => {
          error.value = '';
          if (!inputText.value) {
            result.value = '';
            return;
          }

          try {
            // 使用DOMParser解析XML
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(inputText.value, 'text/xml');
            
            // 检查解析错误
            const parseError = xmlDoc.querySelector('parsererror');
            if (parseError) {
              throw new Error('XML格式无效: ' + parseError.textContent);
            }
            
            const jsonObj = xmlToJson(xmlDoc);
            result.value = JSON.stringify(jsonObj, null, 2);
          } catch (e) {
            error.value = `XML解析错误: ${e.message}`;
          }
        };

        const xmlToJson = (xmlNode) => {
          const result = {};
          
          // 处理元素节点
          if (xmlNode.nodeType === 1) {
            // 处理属性
            if (xmlNode.attributes.length > 0) {
              for (let i = 0; i < xmlNode.attributes.length; i++) {
                const attr = xmlNode.attributes[i];
                result[`@_${attr.name}`] = attr.value;
              }
            }
            
            // 处理子节点
            if (xmlNode.childNodes.length > 0) {
              for (let i = 0; i < xmlNode.childNodes.length; i++) {
                const child = xmlNode.childNodes[i];
                
                if (child.nodeType === 3) { // 文本节点
                  const textContent = child.textContent.trim();
                  if (textContent) {
                    // 如果已经有属性了，使用#text作为键
                    if (Object.keys(result).length > 0) {
                      result['#text'] = textContent;
                    } else {
                      // 否则直接返回文本内容
                      return textContent;
                    }
                  }
                } else if (child.nodeType === 1) { // 元素节点
                  const nodeName = child.nodeName;
                  const childResult = xmlToJson(child);
                  
                  if (result[nodeName]) {
                    // 如果已存在同名节点，转换为数组
                    if (!Array.isArray(result[nodeName])) {
                      result[nodeName] = [result[nodeName]];
                    }
                    result[nodeName].push(childResult);
                  } else {
                    result[nodeName] = childResult;
                  }
                }
              }
            }
          }
          
          return result;
        };

        const validateJson = () => {
          error.value = '';
          if (!inputText.value) {
            result.value = '请输入JSON数据';
            return;
          }

          try {
            JSON.parse(inputText.value);
            result.value = '✓ JSON格式有效';
          } catch (e) {
            error.value = `JSON格式错误: ${e.message}`;
          }
        };

        const clearText = () => {
          inputText.value = '';
          result.value = '';
          error.value = '';
        };

        return {
          inputText,
          result,
          error,
          convertJsonToXml,
          convertXmlToJson,
          validateJson,
          clearText
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
