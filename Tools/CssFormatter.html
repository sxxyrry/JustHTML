<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS格式化工具 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <script src="../assets/AddHeader_Tools.js"></script>
  <script src="../assets/AddFooter.js"></script>
  <script src="../assets/AddIco.js"></script>

  <style>
    .converter-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    .converter-section {
      display: flex;
      flex-direction: column;
    }
    
    .converter-section textarea {
      flex: 1;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
    
    .options-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .option-item {
      display: flex;
      align-items: center;
    }
    
    .option-item input[type="checkbox"] {
      margin-right: 8px;
    }
    
    @media (max-width: 768px) {
      .converter-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>CSS格式化工具</h2>
        <p>格式化CSS代码，使其更易读和维护</p>
        
        <div class="info-box">
          <p><strong>功能说明：</strong></p>
          <p>• 格式化：使CSS代码结构清晰，易于阅读和编辑</p>
          <p>• 选项配置：可选择是否保留注释、空行等</p>
          <p>• 验证：检查CSS代码的基本语法</p>
        </div>
        
        <div class="options-container">
          <div class="option-item">
            <input type="checkbox" id="preserveComments" v-model="options.preserveComments">
            <label for="preserveComments">保留注释</label>
          </div>
          
          <div class="option-item">
            <input type="checkbox" id="expandShorthand" v-model="options.expandShorthand">
            <label for="expandShorthand">展开简写属性</label>
          </div>
          
          <div class="option-item">
            <input type="checkbox" id="addEmptyLine" v-model="options.addEmptyLine">
            <label for="addEmptyLine">规则间添加空行</label>
          </div>
        </div>
        
        <div class="converter-container">
          <div class="converter-section">
            <h3>原始CSS</h3>
            <textarea 
              v-model="inputCss" 
              placeholder="在此输入CSS代码..."
              rows="15"
            ></textarea>
          </div>
          
          <div class="converter-section">
            <h3>格式化后的CSS</h3>
            <textarea 
              v-model="formattedCss" 
              placeholder="格式化后的CSS代码将在这里显示"
              rows="15"
              readonly
            ></textarea>
          </div>
        </div>
        
        <div class="controls">
          <button @click="formatCss">格式化CSS</button>
          <button @click="validateCss">验证CSS</button>
          <button @click="clearAll">清空</button>
          <button @click="copyResult">复制结果</button>
          <button @click="loadExample">加载示例</button>
        </div>
        
        <div class="result" v-if="validationResult">
          {{ validationResult }}
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const inputCss = ref('');
        const formattedCss = ref('');
        const validationResult = ref('');
        const options = ref({
          preserveComments: true,
          expandShorthand: false,
          addEmptyLine: true
        });
        
        // 格式化CSS的函数
        const formatCss = () => {
          if (!inputCss.value.trim()) {
            formattedCss.value = '';
            validationResult.value = '请输入CSS代码';
            return;
          }
          
          try {
            let css = inputCss.value;
            
            // 保存注释还是删除注释
            if (!options.value.preserveComments) {
              css = css.replace(/\/\*[\s\S]*?\*\//g, '');
            }
            
            // 临时替换引号内的内容，避免处理引号内的符号
            const placeholders = [];
            css = css.replace(/(["'])((?:(?!\1)[^\\]|\\.)*)(\1)/g, (match, quote, content) => {
              const id = `__PLACEHOLDER_${placeholders.length}__`;
              placeholders.push(quote + content + quote);
              return id;
            });
            
            // 确保每个选择器和右花括号前后都有适当的换行
            css = css.replace(/\s*{\s*/g, ' {\n  ');
            css = css.replace(/;/g, ';\n  ');
            css = css.replace(/}\s*/g, '\n}\n\n');
            
            // 处理多个连续的换行符
            css = css.replace(/\n\s*\n/g, '\n\n');
            
            // 处理选择器之间的逗号
            css = css.replace(/,\s*/g, ', ');
            
            // 清理多余的空行
            css = css.replace(/\n{3,}/g, '\n\n');
            
            // 替换回之前保存的内容
            placeholders.forEach((placeholder, index) => {
              css = css.replace(new RegExp(`__PLACEHOLDER_${index}__`, 'g'), placeholder);
            });
            
            // 最后去除多余的空格和换行
            css = css.trim();
            
            formattedCss.value = css;
            validationResult.value = 'CSS格式化成功';
          } catch (error) {
            validationResult.value = `格式化失败: ${error.message}`;
          }
        };
        
        // 验证CSS的函数
        const validateCss = () => {
          if (!inputCss.value.trim()) {
            validationResult.value = '请先输入CSS代码';
            return;
          }
          
          try {
            // 简单的语法验证 - 检查括号匹配
            const openBraces = (inputCss.value.match(/\{/g) || []).length;
            const closeBraces = (inputCss.value.match(/\}/g) || []).length;
            
            if (openBraces !== closeBraces) {
              validationResult.value = `CSS语法警告: 括号不匹配 (${openBraces} 个 {, ${closeBraces} 个 })`;
              return;
            }
            
            // 检查是否有明显的语法错误
            if (inputCss.value.includes('{;') || inputCss.value.includes(';;')) {
              validationResult.value = 'CSS可能存在问题，请检查语法';
              return;
            }
            
            validationResult.value = 'CSS语法检查完成，未发现明显错误';
          } catch (error) {
            validationResult.value = `验证失败: ${error.message}`;
          }
        };
        
        // 清空所有内容
        const clearAll = () => {
          inputCss.value = '';
          formattedCss.value = '';
          validationResult.value = '';
        };
        
        // 复制结果到剪贴板
        const copyResult = async () => {
          if (!formattedCss.value) {
            validationResult.value = '没有可复制的内容';
            return;
          }
          
          try {
            await navigator.clipboard.writeText(formattedCss.value);
            validationResult.value = '已复制到剪贴板';
          } catch (error) {
            validationResult.value = '复制失败，请手动复制';
          }
        };
        
        // 加载示例
        const loadExample = () => {
          inputCss.value = `/* 这是一个示例CSS */.container{margin:0;padding:20px;background-color:#fff}.header{position:relative;width:100%;height:60px;background:linear-gradient(to bottom,#ffffff,#f5f5f5);border-bottom:1px solid #ddd}.nav-item{display:inline-block;margin-right:20px;padding:5px 10px;text-decoration:none;color:#333;border-radius:4px;}`;
          formatCss(); // 自动格式化示例
        };
        
        return {
          inputCss,
          formattedCss,
          validationResult,
          options,
          formatCss,
          validateCss,
          clearAll,
          copyResult,
          loadExample
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
