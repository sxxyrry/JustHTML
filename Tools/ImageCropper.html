<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片裁剪工具 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>
  <style>
    .cropping-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .control-item {
      display: flex;
      flex-direction: column;
    }
    
    .control-item label {
      margin-bottom: 5px;
      color: var(--accent-color);
    }
    
    .control-item input {
      padding: 8px;
    }
    
    .image-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }
    
    .image-preview {
      flex: 1;
      min-width: 300px;
      text-align: center;
    }
    
    .image-preview img {
      max-width: 100%;
      max-height: 400px;
      display: block;
      margin: 0 auto;
    }
    
    .crop-area {
      position: relative;
      display: inline-block;
      margin: 0 auto;
    }
    
    .crop-overlay {
      position: absolute;
      border: 2px dashed rgba(255, 255, 255, 0.7);
      background: transparent;
      cursor: move;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
    
    .crop-coordinates {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>图片裁剪工具</h2>
        <p>从图片中裁剪出指定区域</p>
        
        <div class="info-box">
          <p><strong>使用说明：</strong></p>
          <p>• 上传图片后，在图片上拖拽鼠标选择要裁剪的区域</p>
          <p>• 也可以直接输入坐标和尺寸参数</p>
          <p>• 裁剪完成后点击"裁剪图片"按钮</p>
        </div>
        
        <div>
          <input type="file" @change="handleFileUpload" accept="image/*" />
          
          <div class="cropping-controls">
            <div class="control-item">
              <label for="x">X坐标 (px)</label>
              <input type="number" id="x" v-model.number="x" />
            </div>
            
            <div class="control-item">
              <label for="y">Y坐标 (px)</label>
              <input type="number" id="y" v-model.number="y" />
            </div>
            
            <div class="control-item">
              <label for="cropWidth">裁剪宽度 (px)</label>
              <input type="number" id="cropWidth" v-model.number="cropWidth" />
            </div>
            
            <div class="control-item">
              <label for="cropHeight">裁剪高度 (px)</label>
              <input type="number" id="cropHeight" v-model.number="cropHeight" />
            </div>
          </div>
          
          <div class="crop-coordinates">
            <div class="control-item">
              <label>
                <input type="checkbox" v-model="fixedRatio"> 固定宽高比
              </label>
            </div>
            
            <div class="control-item" v-if="fixedRatio">
              <label for="ratio">宽高比</label>
              <select id="ratio" v-model="aspectRatio">
                <option value="1">1:1 (正方形)</option>
                <option value="1.777">16:9</option>
                <option value="1.333">4:3</option>
                <option value="1.5">3:2</option>
                <option value="0">自定义</option>
              </select>
            </div>
            
            <div class="control-item" v-if="fixedRatio && aspectRatio === 0">
              <label for="customRatio">自定义比例</label>
              <input type="number" id="customRatio" v-model.number="customAspect" step="0.01" min="0.1" max="10" placeholder="如：1.5" />
            </div>
          </div>
          
          <div class="controls">
            <button @click="cropImage" :disabled="!originalImage">裁剪图片</button>
            <button @click="resetCropArea">重置裁剪区</button>
            <button @click="resetForm">重置全部</button>
          </div>
          
          <div class="image-container" v-if="originalImage">
            <div class="image-preview">
              <h3>原始图片</h3>
              <div class="crop-area">
                <img 
                  :src="originalImage" 
                  alt="Original Image" 
                  ref="imageRef"
                  @mousedown="startDrag"
                  @mousemove="dragCrop"
                  @mouseup="endDrag"
                  @mouseleave="endDrag"
                />
                <div 
                  class="crop-overlay" 
                  :style="{
                    left: x + 'px',
                    top: y + 'px',
                    width: cropWidth + 'px',
                    height: cropHeight + 'px',
                    display: cropWidth > 0 && cropHeight > 0 ? 'block' : 'none'
                  }"
                ></div>
              </div>
              <p>尺寸: {{ originalWidth }} x {{ originalHeight }}</p>
            </div>
            
            <div class="image-preview" v-if="croppedImage">
              <h3>裁剪后图片</h3>
              <img :src="croppedImage" alt="Cropped Image" />
              <p>尺寸: {{ croppedWidth }} x {{ croppedHeight }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const originalImage = ref('');
        const originalWidth = ref(0);
        const originalHeight = ref(0);
        const x = ref(0);
        const y = ref(0);
        const cropWidth = ref(100);
        const cropHeight = ref(100);
        const croppedImage = ref('');
        const croppedWidth = ref(0);
        const croppedHeight = ref(0);
        const fixedRatio = ref(false);
        const aspectRatio = ref('1');
        const customAspect = ref(1);
        const imageRef = ref(null);
        const isDragging = ref(false);
        const startX = ref(0);
        const startY = ref(0);
        
        const handleFileUpload = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = (e) => {
            originalImage.value = e.target.result;
            
            // 获取原始图片尺寸
            const img = new Image();
            img.onload = () => {
              originalWidth.value = img.width;
              originalHeight.value = img.height;
              
              // 设置默认裁剪区域为中心区域
              cropWidth.value = Math.min(img.width / 3, 200);
              cropHeight.value = Math.min(img.height / 3, 200);
              x.value = (img.width - cropWidth.value) / 2;
              y.value = (img.height - cropHeight.value) / 2;
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        };

        const startDrag = (e) => {
          if (!originalImage.value) return;
          
          const rect = e.target.getBoundingClientRect();
          startX.value = e.clientX - rect.left;
          startY.value = e.clientY - rect.top;
          isDragging.value = true;
        };

        const dragCrop = (e) => {
          if (!isDragging.value || !originalImage.value) return;
          
          const rect = e.target.getBoundingClientRect();
          const currentX = e.clientX - rect.left;
          const currentY = e.clientY - rect.top;
          
          let newWidth = currentX - startX.value;
          let newHeight = currentY - startY.value;
          
          // 限制选区在图片范围内
          if (newWidth > 0) {
            newWidth = Math.min(newWidth, originalWidth.value - startX.value);
          } else {
            newWidth = Math.max(newWidth, -startX.value);
          }
          
          if (newHeight > 0) {
            newHeight = Math.min(newHeight, originalHeight.value - startY.value);
          } else {
            newHeight = Math.max(newHeight, -startY.value);
          }
          
          // 如果启用了固定宽高比
          if (fixedRatio.value) {
            const ratio = aspectRatio.value === '0' ? customAspect.value : parseFloat(aspectRatio.value);
            if (Math.abs(newWidth) > Math.abs(newHeight * ratio)) {
              newHeight = newWidth / ratio;
            } else {
              newWidth = newHeight * ratio;
            }
            
            // 修正超出边界的选区
            if (startX.value + newWidth > originalWidth.value) {
              newWidth = originalWidth.value - startX.value;
              newHeight = newWidth / ratio;
            }
            if (startY.value + newHeight > originalHeight.value) {
              newHeight = originalHeight.value - startY.value;
              newWidth = newHeight * ratio;
            }
          }
          
          x.value = Math.min(startX.value, startX.value + newWidth);
          y.value = Math.min(startY.value, startY.value + newHeight);
          cropWidth.value = Math.abs(newWidth);
          cropHeight.value = Math.abs(newHeight);
        };

        const endDrag = () => {
          isDragging.value = false;
        };

        const cropImage = () => {
          if (!originalImage.value || cropWidth.value <= 0 || cropHeight.value <= 0) return;
          
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = cropWidth.value;
            canvas.height = cropHeight.value;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(
              img,
              x.value, y.value, cropWidth.value, cropHeight.value,
              0, 0, cropWidth.value, cropHeight.value
            );
            
            croppedImage.value = canvas.toDataURL('image/jpeg', 0.9);
            croppedWidth.value = cropWidth.value;
            croppedHeight.value = cropHeight.value;
            
            // 创建下载链接
            const link = document.createElement('a');
            link.href = croppedImage.value;
            link.download = 'cropped_image.jpg';
            link.click();
          };
          img.src = originalImage.value;
        };

        const resetCropArea = () => {
          cropWidth.value = 100;
          cropHeight.value = 100;
          x.value = 0;
          y.value = 0;
        };

        const resetForm = () => {
          originalImage.value = '';
          cropWidth.value = 100;
          cropHeight.value = 100;
          x.value = 0;
          y.value = 0;
          croppedImage.value = '';
          originalWidth.value = 0;
          originalHeight.value = 0;
          croppedWidth.value = 0;
          croppedHeight.value = 0;
          fixedRatio.value = false;
          aspectRatio.value = '1';
          customAspect.value = 1;
        };

        return {
          originalImage,
          originalWidth,
          originalHeight,
          x,
          y,
          cropWidth,
          cropHeight,
          croppedImage,
          croppedWidth,
          croppedHeight,
          fixedRatio,
          aspectRatio,
          customAspect,
          imageRef,
          handleFileUpload,
          startDrag,
          dragCrop,
          endDrag,
          cropImage,
          resetCropArea,
          resetForm
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
