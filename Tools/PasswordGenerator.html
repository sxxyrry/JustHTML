<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码生成器 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}

/**
 * 动态加载（强制去除缓存） JS 的函数
 * @param {string} src - 要加载的 JS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    script.async = true;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
    let scriptArray = [
      "../assets/AddHeader_Tools.js",
      "../assets/AddFooter.js",
      "../assets/AddIco.js",
      "../assets/AutoRun.js",
    ]

    scriptArray.forEach(script => {
      loadScript(script);
    });
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <style>
    .password-generator {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .setting-group {
      margin: 15px 0;
      padding: 10px;
      background-color: var(--bg-tertiary);
      border-radius: var(--border-radius);
    }
    
    .setting-item {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    
    .setting-item input, .setting-item select {
      margin-left: 10px;
    }
    
    .setting-item label {
      flex: 1;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
    
    .password-display {
      background-color: var(--bg-tertiary);
      padding: 15px;
      border-radius: var(--border-radius);
      margin: 15px 0;
      word-break: break-all;
      font-size: 1.2em;
      text-align: center;
    }
    
    .strength-meter {
      height: 10px;
      background-color: var(--bg-secondary);
      border-radius: 5px;
      margin: 10px 0;
      overflow: hidden;
    }
    
    .strength-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .strength-weak { background-color: #e74c3c; }
    .strength-medium { background-color: #f39c12; }
    .strength-strong { background-color: #2ecc71; }
    
    .strength-label {
      text-align: center;
      font-weight: bold;
    }
    
    .strength-weak-text { color: #e74c3c; }
    .strength-medium-text { color: #f39c12; }
    .strength-strong-text { color: #2ecc71; }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section password-generator">
        <h2>密码生成器</h2>
        <p>生成安全的随机密码</p>
        
        <div class="info-box">
          <p><strong>功能说明：</strong></p>
          <p>• 自定义密码长度</p>
          <p>• 选择包含的字符类型</p>
          <p>• 评估密码强度</p>
          <p>• 一键复制密码</p>
        </div>
        
        <div>
          <div class="setting-group">
            <h3>密码设置</h3>
            
            <div class="setting-item">
              <label for="passwordLength">密码长度</label>
              <input 
                type="range" 
                id="passwordLength" 
                v-model.number="settings.length" 
                min="4" 
                max="128" 
                @change="generatePassword"
              >
              <span>{{ settings.length }}</span>
            </div>
            
            <div class="setting-item">
              <input 
                type="checkbox" 
                id="includeUppercase" 
                v-model="settings.includeUppercase"
                @change="generatePassword"
              >
              <label for="includeUppercase">包含大写字母 (A-Z)</label>
            </div>
            
            <div class="setting-item">
              <input 
                type="checkbox" 
                id="includeLowercase" 
                v-model="settings.includeLowercase"
                @change="generatePassword"
              >
              <label for="includeLowercase">包含小写字母 (a-z)</label>
            </div>
            
            <div class="setting-item">
              <input 
                type="checkbox" 
                id="includeNumbers" 
                v-model="settings.includeNumbers"
                @change="generatePassword"
              >
              <label for="includeNumbers">包含数字 (0-9)</label>
            </div>
            
            <div class="setting-item">
              <input 
                type="checkbox" 
                id="includeSymbols" 
                v-model="settings.includeSymbols"
                @change="generatePassword"
              >
              <label for="includeSymbols">包含符号 (!@#$%^&*等)</label>
            </div>
            
            <div class="setting-item">
              <input 
                type="checkbox" 
                id="excludeSimilar" 
                v-model="settings.excludeSimilar"
                @change="generatePassword"
              >
              <label for="excludeSimilar">排除相似字符 (0, O, l, 1等)</label>
            </div>
          </div>
          
          <div class="controls">
            <button @click="generatePassword">生成密码</button>
            <button @click="copyPassword">复制密码</button>
          </div>
          
          <div class="password-display" v-if="generatedPassword">
            {{ generatedPassword }}
          </div>
          
          <div class="strength-meter">
            <div 
              class="strength-fill" 
              :class="strengthClass" 
              :style="{ width: strengthWidth + '%' }"
            ></div>
          </div>
          <div class="strength-label" :class="strengthLabelClass">
            密码强度: {{ strengthText }}
          </div>
          
          <div class="info-box">
            <p><strong>密码安全提示：</strong></p>
            <p>• 使用足够长的密码（建议12位以上）</p>
            <p>• 包含多种类型的字符</p>
            <p>• 不要在多个账户使用相同密码</p>
            <p>• 定期更换密码</p>
            <p>• 使用密码管理器来管理密码</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, computed } = Vue;

    createApp({
      setup() {
        // 密码生成设置
        const settings = reactive({
          length: 12,
          includeUppercase: true,
          includeLowercase: true,
          includeNumbers: true,
          includeSymbols: true,
          excludeSimilar: false
        });
        
        const generatedPassword = ref('');

        // 字符集
        const characterSets = {
          uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
          lowercase: 'abcdefghijklmnopqrstuvwxyz',
          numbers: '0123456789',
          symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?',
          similar: '0O1lI'
        };

        // 生成密码
        const generatePassword = () => {
          let chars = '';
          
          if (settings.includeUppercase) chars += characterSets.uppercase;
          if (settings.includeLowercase) chars += characterSets.lowercase;
          if (settings.includeNumbers) chars += characterSets.numbers;
          if (settings.includeSymbols) chars += characterSets.symbols;
          
          if (settings.excludeSimilar) {
            // 从字符集中移除相似字符
            chars = chars.split('').filter(char => !characterSets.similar.includes(char)).join('');
          }
          
          if (!chars) {
            generatedPassword.value = '请选择至少一种字符类型';
            return;
          }
          
          let password = '';
          for (let i = 0; i < settings.length; i++) {
            password += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          
          generatedPassword.value = password;
        };

        // 计算密码强度
        const strengthWidth = computed(() => {
          if (!generatedPassword.value) return 0;
          
          let score = 0;
          
          // 长度评分
          if (generatedPassword.value.length >= 8) score += 25;
          if (generatedPassword.value.length >= 12) score += 25;
          if (generatedPassword.value.length >= 16) score += 25;
          
          // 字符类型评分
          if (/[A-Z]/.test(generatedPassword.value)) score += 10;
          if (/[a-z]/.test(generatedPassword.value)) score += 10;
          if (/[0-9]/.test(generatedPassword.value)) score += 10;
          if (/[^A-Za-z0-9]/.test(generatedPassword.value)) score += 15;
          
          return Math.min(score, 100);
        });
        
        const strengthText = computed(() => {
          if (strengthWidth.value < 40) return '弱';
          if (strengthWidth.value < 70) return '中等';
          return '强';
        });
        
        const strengthClass = computed(() => {
          if (strengthWidth.value < 40) return 'strength-weak';
          if (strengthWidth.value < 70) return 'strength-medium';
          return 'strength-strong';
        });
        
        const strengthLabelClass = computed(() => {
          if (strengthWidth.value < 40) return 'strength-weak-text';
          if (strengthWidth.value < 70) return 'strength-medium-text';
          return 'strength-strong-text';
        });

        // 复制密码
        const copyPassword = () => {
          if (generatedPassword.value) {
            navigator.clipboard.writeText(generatedPassword.value)
              .then(() => {
                alert('密码已复制到剪贴板！');
              })
              .catch(err => {
                console.error('复制失败: ', err);
                alert('复制失败');
              });
          }
        };

        // 初始化生成一个密码
        generatePassword();

        return {
          settings,
          generatedPassword,
          strengthWidth,
          strengthText,
          strengthClass,
          strengthLabelClass,
          generatePassword,
          copyPassword
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
