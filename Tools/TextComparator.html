<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本对比工具 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>
  <style>
    .compare-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0;
    }
    
    @media (max-width: 768px) {
      .compare-container {
        grid-template-columns: 1fr;
      }
    }
    
    .input-group {
      margin-bottom: 15px;
    }
    
    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--accent-color);
    }
    
    .diff-result {
      margin-top: 20px;
      padding: 15px;
      background-color: var(--bg-tertiary);
      border-radius: var(--border-radius);
      font-family: monospace;
      white-space: pre-wrap;
    }
    
    .diff-added {
      background-color: rgba(72, 199, 116, 0.3);
    }
    
    .diff-removed {
      background-color: rgba(255, 107, 107, 0.3);
    }
    
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .stat-item {
      padding: 10px;
      background-color: var(--bg-secondary);
      border-radius: var(--border-radius);
      text-align: center;
    }
    
    .stat-value {
      font-size: 1.5em;
      font-weight: bold;
      color: var(--accent-color);
    }
    
    .stat-label {
      font-size: 0.9em;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>文本对比工具</h2>
        <p>比较两个文本的差异</p>
        
        <div>
          <div class="compare-container">
            <div>
              <div class="input-group">
                <label for="text1">文本1</label>
                <textarea 
                  id="text1" 
                  v-model="text1" 
                  @input="compareTexts"
                  placeholder="在此输入第一个文本..."
                  rows="10"
                ></textarea>
              </div>
            </div>
            
            <div>
              <div class="input-group">
                <label for="text2">文本2</label>
                <textarea 
                  id="text2" 
                  v-model="text2" 
                  @input="compareTexts"
                  placeholder="在此输入第二个文本..."
                  rows="10"
                ></textarea>
              </div>
            </div>
          </div>
          
          <div class="stats-container">
            <div class="stat-item">
              <div class="stat-value">{{ text1.length }}</div>
              <div class="stat-label">文本1字符数</div>
            </div>
            
            <div class="stat-item">
              <div class="stat-value">{{ text2.length }}</div>
              <div class="stat-label">文本2字符数</div>
            </div>
            
            <div class="stat-item">
              <div class="stat-value">{{ diffChars }}</div>
              <div class="stat-label">字符差异</div>
            </div>
            
            <div class="stat-item">
              <div class="stat-value">{{ similarity.toFixed(2) }}%</div>
              <div class="stat-label">相似度</div>
            </div>
          </div>
          
          <div class="controls">
            <button @click="compareTexts">对比文本</button>
            <button @click="swapTexts">交换文本</button>
            <button @click="clearTexts">清空文本</button>
          </div>
          
          <div class="diff-result" v-if="diffResult" v-html="diffResult"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        const text1 = ref('');
        const text2 = ref('');
        const diffResult = ref('');
        const diffChars = ref(0);
        const similarity = ref(0);

        // 简单的文本对比算法
        const compareTexts = () => {
          const t1 = text1.value;
          const t2 = text2.value;
          
          if (!t1 && !t2) {
            diffResult.value = '';
            diffChars.value = 0;
            similarity.value = 100;
            return;
          }
          
          if (!t1) {
            diffResult.value = `<span class="diff-added">${escapeHtml(t2)}</span>`;
            diffChars.value = t2.length;
            similarity.value = 0;
            return;
          }
          
          if (!t2) {
            diffResult.value = `<span class="diff-removed">${escapeHtml(t1)}</span>`;
            diffChars.value = t1.length;
            similarity.value = 0;
            return;
          }
          
          // 简单的差异计算
          let result = '';
          let removedCount = 0;
          let addedCount = 0;
          let maxLen = Math.max(t1.length, t2.length);
          
          for (let i = 0; i < maxLen; i++) {
            if (i >= t1.length) {
              // 在t2中新增的字符
              result += `<span class="diff-added">${escapeHtml(t2[i])}</span>`;
              addedCount++;
            } else if (i >= t2.length) {
              // 在t1中删除的字符
              result += `<span class="diff-removed">${escapeHtml(t1[i])}</span>`;
              removedCount++;
            } else if (t1[i] !== t2[i]) {
              // 不同的字符
              result += `<span class="diff-removed">${escapeHtml(t1[i])}</span><span class="diff-added">${escapeHtml(t2[i])}</span>`;
              removedCount++;
              addedCount++;
            } else {
              // 相同的字符
              result += escapeHtml(t2[i]);
            }
          }
          
          diffResult.value = result;
          diffChars.value = removedCount + addedCount;
          
          // 计算相似度
          const maxLength = Math.max(t1.length, t2.length);
          similarity.value = maxLength === 0 ? 100 : (1 - diffChars.value / maxLength) * 100;
        };

        const swapTexts = () => {
          const temp = text1.value;
          text1.value = text2.value;
          text2.value = temp;
          compareTexts();
        };

        const clearTexts = () => {
          text1.value = '';
          text2.value = '';
          diffResult.value = '';
          diffChars.value = 0;
          similarity.value = 0;
        };

        // 转义HTML字符以防止XSS
        const escapeHtml = (text) => {
          return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\n/g, "<br>");
        };

        return {
          text1,
          text2,
          diffResult,
          diffChars,
          similarity,
          compareTexts,
          swapTexts,
          clearTexts
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
