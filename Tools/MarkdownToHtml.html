<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown转换工具 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script src="../package/Marked/code/marked.umd.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>
  <style>
    .converter-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .option-item {
      display: flex;
      align-items: center;
    }
    
    .option-item input[type="checkbox"] {
      margin-right: 8px;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .preview-container {
      margin-top: 20px;
      padding: 15px;
      background-color: var(--bg-tertiary);
      border-radius: var(--border-radius);
      border-left: 4px solid var(--accent-color);
    }
    
    .preview-container h1, .preview-container h2, .preview-container h3 {
      color: var(--accent-color);
    }
    
    .preview-container a {
      color: #4a9eff;
      text-decoration: none;
    }
    
    .preview-container a:hover {
      text-decoration: underline;
    }
    
    .preview-container pre {
      background-color: var(--bg-primary);
      padding: 10px;
      border-radius: var(--border-radius);
      overflow-x: auto;
    }
    
    .preview-container code {
      font-family: 'Courier New', monospace;
      background-color: var(--bg-primary);
      padding: 2px 4px;
      border-radius: 3px;
    }
    
    .preview-container blockquote {
      border-left: 3px solid var(--accent-color);
      padding-left: 10px;
      margin-left: 0;
      color: var(--text-secondary);
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>Markdown转换工具</h2>
        <p>将Markdown转换为HTML或纯文本</p>
        
        <div class="info-box">
          <p><strong>常用Markdown语法：</strong></p>
          <p># 标题1 | ## 标题2 | ### 标题3</p>
          <p>**粗体** | *斜体*</p>
          <p>[链接](url) | ![图片](url)</p>
          <p>`代码` | ```代码块```</p>
          <p>> 引用 | - 列表项</p>
        </div>
        
        <div>
          <textarea 
            v-model="inputText" 
            placeholder="在此输入Markdown内容..."
            rows="12"
          ></textarea>
          
          <div class="converter-options">
            <div class="option-item">
              <input type="checkbox" id="enableHtml" v-model="options.enableHtml" checked>
              <label for="enableHtml">启用HTML</label>
            </div>
            
            <div class="option-item">
              <input type="checkbox" id="breaks" v-model="options.breaks">
              <label for="breaks">启用换行符</label>
            </div>
          </div>
          
          <div class="controls">
            <button @click="convertToHtml">转换为HTML</button>
            <button @click="convertToPlainText">转换为纯文本</button>
            <button @click="enablePreview">实时预览</button>
            <button @click="clearText">清空</button>
          </div>
          
          <div class="result" v-if="result">
            <p><strong>结果:</strong></p>
            <pre>{{ result }}</pre>
          </div>
          
          <div class="preview-container" v-if="showPreview" v-html="previewHtml"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, watch } = Vue;

    createApp({
      setup() {
        const inputText = ref('');
        const result = ref('');
        const showPreview = ref(false);
        const previewHtml = ref('');
        const options = ref({
          enableHtml: true,
          breaks: false
        });

        // 设置marked选项
        const updateMarkedOptions = () => {
          marked.setOptions({
            gfm: true,
            breaks: options.value.breaks,
            smartLists: true,
            smartypants: true,
            xhtml: options.value.enableHtml
          });
        };

        // 初始化marked选项
        updateMarkedOptions();

        // 监听选项变化
        watch(options, () => {
          updateMarkedOptions();
          if (showPreview.value) {
            updatePreview();
          }
        });

        const convertToHtml = () => {
          if (!inputText.value) {
            result.value = '';
            return;
          }
          
          result.value = marked.parse(inputText.value);
        };

        const convertToPlainText = () => {
          if (!inputText.value) {
            result.value = '';
            return;
          }
          
          // 先转换为HTML，然后移除所有标签
          const html = marked.parse(inputText.value);
          const tmp = document.createElement('div');
          tmp.innerHTML = html;
          result.value = tmp.textContent || tmp.innerText || '';
        };

        const updatePreview = () => {
          if (!inputText.value) {
            previewHtml.value = '';
            return;
          }
          
          previewHtml.value = marked.parse(inputText.value);
        };

        const enablePreview = () => {
          showPreview.value = !showPreview.value;
          if (showPreview.value) {
            updatePreview();
          }
        };

        const clearText = () => {
          inputText.value = '';
          result.value = '';
          previewHtml.value = '';
          showPreview.value = false;
        };

        return {
          inputText,
          result,
          showPreview,
          previewHtml,
          options,
          convertToHtml,
          convertToPlainText,
          enablePreview,
          clearText
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
