<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base36编码/解码工具 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}

/**
 * 动态加载（强制去除缓存） JS 的函数
 * @param {string} src - 要加载的 JS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    script.async = true;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
    let scriptArray = [
      "../assets/AddHeader_Tools.js",
      "../assets/AddFooter.js",
      "../assets/AddIco.js",
      "../assets/AutoRun.js",
    ]

    scriptArray.forEach(script => {
      loadScript(script);
    });
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>Base36编码/解码工具</h2>
        <p>将数字转换为Base36编码或将Base36编码解码为数字</p>
        
        <div>
          <textarea 
            v-model="inputText" 
            placeholder="在此输入要编码或解码的数字或Base36字符串..."
            rows="8"
          ></textarea>
          
          <button @click="encodeBase36">数字转Base36</button>
          <button @click="decodeBase36">Base36转数字</button>
          <button @click="clearText">清空</button>
          
          <div class="result" v-if="result">
            <p><strong>结果:</strong></p>
            <pre>{{ result }}</pre>
          </div>
          
          <div class="result" v-if="error" style="color: #ff6b6b;">
            <p><strong>错误:</strong></p>
            <p>{{ error }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const inputText = ref('');
        const result = ref('');
        const error = ref('');
        
        // Base36编码函数（数字转Base36）
        const encodeBase36 = () => {
          error.value = '';
          try {
            // 尝试将输入解析为数字
            const num = parseInt(inputText.value.trim());
            if (isNaN(num)) {
              throw new Error("输入不是有效的数字");
            }
            if (num < 0) {
              throw new Error("目前仅支持非负整数");
            }
            
            result.value = num.toString(36).toUpperCase();
          } catch (e) {
            error.value = `编码失败: ${e.message}`;
          }
        };
        
        // Base36解码函数（Base36转数字）
        const decodeBase36 = () => {
          error.value = '';
          try {
            const base36Str = inputText.value.trim().toLowerCase();
            if (!/^[0-9a-z]+$/.test(base36Str)) {
              throw new Error("输入包含无效的Base36字符");
            }
            
            const num = parseInt(base36Str, 36);
            if (isNaN(num)) {
              throw new Error("无法解析Base36字符串");
            }
            
            result.value = num.toString();
          } catch (e) {
            error.value = `解码失败: ${e.message}`;
          }
        };
        
        const clearText = () => {
          inputText.value = '';
          result.value = '';
          error.value = '';
        };

        return {
          inputText,
          result,
          error,
          encodeBase36,
          decodeBase36,
          clearText
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
