<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64编码/解码工具 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}

/**
 * 动态加载（强制去除缓存） JS 的函数
 * @param {string} src - 要加载的 JS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    script.async = true;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
    let scriptArray = [
      "../assets/AddHeader_Tools.js",
      "../assets/AddFooter.js",
      "../assets/AddIco.js",
      "../assets/AutoRun.js",
    ]

    scriptArray.forEach(script => {
      loadScript(script);
    });
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>Base64编码/解码工具</h2>
        <p>对文本进行Base64编码或解码</p>
        
        <div>
          <textarea 
            v-model="inputText" 
            placeholder="在此输入要进行Base64编码或解码的文本..."
            rows="6"
          ></textarea>
          
          <button @click="encodeBase64">Base64编码</button>
          <button @click="decodeBase64">Base64解码</button>
          <button @click="clearText">清空</button>
          <button @click="copyResult">复制结果</button>
          
          <div class="result" v-if="result">
            <p><strong>结果:</strong></p>
            <pre>{{ result }}</pre>
          </div>
          
          <div class="result" v-if="error" style="color: #ff6b6b;">
            <p><strong>错误:</strong></p>
            <p>{{ error }}</p>
          </div>
          
          <div class="result">
            <h3>关于Base64</h3>
            <p>Base64是一种基于64个可打印字符来表示二进制数据的表示方法。常用于在通常处理文本数据的场合传输二进制数据。</p>
            <p>Base64编码将三个8位字节（3×8=24）转换为四个6位的值（4×6=24），这些6位的值被映射到64个字符（A-Z, a-z, 0-9, +, /）上。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const inputText = ref('');
        const result = ref('');
        const error = ref('');

        const encodeBase64 = () => {
          error.value = '';
          result.value = '';
          
          if (!inputText.value) {
            error.value = '请输入要编码的文本';
            return;
          }
          
          try {
            // 使用btoa进行Base64编码，但需要处理Unicode字符
            const encoded = btoa(encodeURIComponent(inputText.value).replace(/%([0-9A-F]{2})/g, 
              function(match, p1) {
                return String.fromCharCode('0x' + p1);
              }));
            result.value = encoded;
          } catch (e) {
            error.value = `编码失败: ${e.message}`;
          }
        };

        const decodeBase64 = () => {
          error.value = '';
          result.value = '';
          
          if (!inputText.value) {
            error.value = '请输入要解码的Base64字符串';
            return;
          }
          
          try {
            // 使用atob进行Base64解码，同样需要处理Unicode字符
            const decoded = decodeURIComponent(atob(inputText.value).split('').map(function(c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            result.value = decoded;
          } catch (e) {
            error.value = `解码失败: ${e.message}`;
          }
        };

        const copyResult = () => {
          if (!result.value) {
            error.value = '没有可复制的结果';
            return;
          }
          
          navigator.clipboard.writeText(result.value)
            .then(() => {
              alert('结果已复制到剪贴板！');
            })
            .catch(err => {
              console.error('复制失败: ', err);
              error.value = '复制失败';
            });
        };

        const clearText = () => {
          inputText.value = '';
          result.value = '';
          error.value = '';
        };

        return {
          inputText,
          result,
          error,
          encodeBase64,
          decodeBase64,
          copyResult,
          clearText
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
