<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机抽取器 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>
  <style>
    .picker-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .option-item {
      display: flex;
      flex-direction: column;
    }
    
    .option-item label {
      margin-bottom: 5px;
      color: var(--accent-color);
    }
    
    .option-item input, .option-item select {
      padding: 8px;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
    
    .result-box {
      margin-top: 20px;
      padding: 20px;
      background-color: var(--bg-tertiary);
      border-radius: var(--border-radius);
      border-left: 4px solid var(--accent-color);
      text-align: center;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      font-weight: bold;
    }
    
    .history-box {
      margin-top: 20px;
    }
    
    .history-item {
      padding: 8px;
      background-color: var(--bg-secondary);
      border-radius: var(--border-radius);
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    
    .items-list {
      max-height: 200px;
      overflow-y: auto;
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 15px 0;
    }
    
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--bg-secondary);
    }
    
    .item-actions {
      display: flex;
      gap: 5px;
    }
    
    .item-actions button {
      padding: 3px 8px;
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>随机抽取器</h2>
        <p>从列表中随机抽取指定数量的项目</p>
        
        <div class="info-box">
          <p><strong>功能说明：</strong></p>
          <p>• 可以输入多个项目，每行一个</p>
          <p>• 支持抽取一个或多个项目</p>
          <p>• 支持排除已抽取的项目</p>
          <p>• 显示抽取历史记录</p>
        </div>
        
        <div>
          <textarea 
            v-model="itemsText" 
            placeholder="请输入项目，每行一个&#10;例如：&#10;苹果&#10;香蕉&#10;橙子"
            rows="8"
          ></textarea>
          
          <div class="picker-options">
            <div class="option-item">
              <label for="pickCount">抽取数量</label>
              <input 
                type="number" 
                id="pickCount" 
                v-model.number="pickCount" 
                min="1" 
                :max="items.length"
              >
            </div>
            
            <div class="option-item">
              <label for="excludePicked">抽取后排除</label>
              <select id="excludePicked" v-model="excludePicked">
                <option value="false">允许重复抽取</option>
                <option value="true">抽取后排除</option>
              </select>
            </div>
          </div>
          
          <div class="controls">
            <button @click="pickItems" :disabled="items.length === 0">开始抽取</button>
            <button @click="resetItems" v-if="excludePicked === 'true'">重置列表</button>
            <button @click="clearHistory">清空历史</button>
            <button @click="clearAll">清空全部</button>
          </div>
          
          <div class="result-box" v-if="pickedItems.length > 0">
            <div>
              <p v-if="pickedItems.length === 1"><span style="color: #4a9eff;">{{ pickedItems[0] }}</span></p>
              <div v-else>
                <p v-for="(item, index) in pickedItems" :key="index">
                  <span style="color: #4a9eff;">{{ item }}</span>
                </p>
              </div>
            </div>
          </div>
          
          <div class="items-list" v-if="items.length > 0 && excludePicked === 'true'">
            <h3>待抽取项目列表 ({{ items.length }})</h3>
            <div v-for="(item, index) in items" :key="index" class="item-row">
              <span>{{ item }}</span>
              <div class="item-actions">
                <button @click="removeItem(index)">删除</button>
              </div>
            </div>
          </div>
          
          <div class="history-box" v-if="history.length > 0">
            <h3>抽取历史</h3>
            <div v-for="(record, index) in history" :key="index" class="history-item">
              <span>{{ record.time }} - {{ record.items.join(', ') }}</span>
              <button @click="removeHistory(index)">删除</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, watch } = Vue;

    createApp({
      setup() {
        const itemsText = ref('');
        const pickCount = ref(1);
        const excludePicked = ref('false');
        const pickedItems = ref([]);
        const history = ref([]);
        
        const items = computed(() => {
          return itemsText.value
            .split('\n')
            .map(item => item.trim())
            .filter(item => item !== '');
        });
        
        const pickItems = () => {
          if (items.value.length === 0) {
            alert('请先输入至少一个项目');
            return;
          }
          
          if (pickCount.value <= 0) {
            alert('抽取数量必须大于0');
            return;
          }
          
          if (pickCount.value > items.value.length) {
            alert(`抽取数量不能超过项目总数 (${items.value.length})`);
            return;
          }
          
          // 随机抽取项目
          let shuffled = [...items.value].sort(() => 0.5 - Math.random());
          pickedItems.value = shuffled.slice(0, pickCount.value);
          
          // 添加到历史记录
          history.value.unshift({
            time: new Date().toLocaleString(),
            items: [...pickedItems.value]
          });
          
          // 如果选择了抽取后排除，则从列表中移除已抽取的项目
          if (excludePicked.value === 'true') {
            const remainingItems = items.value.filter(item => !pickedItems.value.includes(item));
            itemsText.value = remainingItems.join('\n');
          }
        };
        
        const removeItem = (index) => {
          const itemList = items.value;
          itemList.splice(index, 1);
          itemsText.value = itemList.join('\n');
        };
        
        const resetItems = () => {
          if (history.value.length > 0) {
            // 从历史记录中恢复所有被抽取的项目
            const allItems = new Set();
            
            // 添加当前剩余项目
            items.value.forEach(item => allItems.add(item));
            
            // 添加历史记录中的项目
            history.value.forEach(record => {
              record.items.forEach(item => allItems.add(item));
            });
            
            itemsText.value = Array.from(allItems).join('\n');
            pickedItems.value = [];
          }
        };
        
        const clearHistory = () => {
          history.value = [];
        };
        
        const removeHistory = (index) => {
          history.value.splice(index, 1);
        };
        
        const clearAll = () => {
          itemsText.value = '';
          pickedItems.value = [];
          history.value = [];
        };
        
        // 监听items变化，确保选取数量不超过项目总数
        watch(items, () => {
          if (pickCount.value > items.value.length && items.value.length > 0) {
            pickCount.value = items.value.length;
          }
        });
        
        return {
          itemsText,
          pickCount,
          excludePicked,
          pickedItems,
          history,
          items,
          pickItems,
          removeItem,
          resetItems,
          clearHistory,
          removeHistory,
          clearAll
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
