<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片拼接工具 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}

/**
 * 动态加载（强制去除缓存） JS 的函数
 * @param {string} src - 要加载的 JS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    script.async = true;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
    let scriptArray = [
      "../assets/AddHeader_Tools.js",
      "../assets/AddFooter.js",
      "../assets/AddIco.js",
      "../assets/AutoRun.js",
    ]

    scriptArray.forEach(script => {
      loadScript(script);
    });
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <style>
    .stitcher-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .control-item {
      display: flex;
      flex-direction: column;
    }
    
    .control-item label {
      margin-bottom: 5px;
      color: var(--accent-color);
    }
    
    .control-item input, .control-item select {
      padding: 8px;
    }
    
    .image-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }
    
    .image-preview {
      flex: 1;
      min-width: 300px;
      text-align: center;
    }
    
    .image-preview img {
      max-width: 100%;
      max-height: 400px;
      display: block;
      margin: 0 auto;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .image-list {
      margin: 15px 0;
      padding: 10px;
      background-color: var(--bg-tertiary);
      border-radius: var(--border-radius);
    }
    
    .image-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background-color: var(--bg-secondary);
      border-radius: var(--border-radius);
      margin-bottom: 8px;
    }
    
    .remove-btn {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: var(--border-radius);
      cursor: pointer;
    }
    
    .layout-options {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }
    
    .layout-btn {
      flex: 1;
      padding: 10px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--bg-tertiary);
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: var(--transition);
    }
    
    .layout-btn.active {
      background-color: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>图片拼接工具</h2>
        <p>将多张图片拼接成一张长图</p>
        
        <div class="info-box">
          <p><strong>使用说明：</strong></p>
          <p>• 点击"添加图片"按钮上传多张图片</p>
          <p>• 选择拼接方向（横向或纵向）</p>
          <p>• 可以调整图片顺序、间距和对齐方式</p>
          <p>• 拼接完成后点击"下载图片"保存</p>
        </div>
        
        <div>
          <input type="file" @change="addImage" accept="image/*" multiple />
          
          <div class="stitcher-controls">
            <div class="control-item">
              <label for="layoutDirection">拼接方向</label>
              <select id="layoutDirection" v-model="layout.direction">
                <option value="horizontal">横向拼接</option>
                <option value="vertical">纵向拼接</option>
              </select>
            </div>
            
            <div class="control-item">
              <label for="spacing">图片间距 (px)</label>
              <input type="number" id="spacing" v-model.number="layout.spacing" min="0" max="100" />
            </div>
            
            <div class="control-item">
              <label for="alignment">对齐方式</label>
              <select id="alignment" v-model="layout.alignment">
                <option value="start">顶端/左对齐</option>
                <option value="center">居中对齐</option>
                <option value="end">底端/右对齐</option>
                <option value="stretch">拉伸填充</option>
              </select>
            </div>
          </div>
          
          <div class="layout-options">
            <div 
              class="layout-btn" 
              :class="{ active: layout.direction === 'horizontal' }"
              @click="layout.direction = 'horizontal'"
            >
              横向拼接
            </div>
            <div 
              class="layout-btn" 
              :class="{ active: layout.direction === 'vertical' }"
              @click="layout.direction = 'vertical'"
            >
              纵向拼接
            </div>
          </div>
          
          <div class="image-list">
            <h3>待拼接图片列表</h3>
            <div 
              class="image-item" 
              v-for="(img, index) in images" 
              :key="index"
            >
              <span>{{ img.name }}</span>
              <div>
                <button @click="moveImage(index, -1)" :disabled="index === 0">↑</button>
                <button @click="moveImage(index, 1)" :disabled="index === images.length - 1">↓</button>
                <button class="remove-btn" @click="removeImage(index)">删除</button>
              </div>
            </div>
          </div>
          
          <div class="controls">
            <button @click="stitchImages" :disabled="images.length < 2">拼接图片</button>
            <button @click="downloadImage" :disabled="!stitchedImage">下载图片</button>
            <button @click="resetAll">重置</button>
          </div>
          
          <div class="image-container" v-if="stitchedImage">
            <div class="image-preview">
              <h3>拼接结果</h3>
              <img :src="stitchedImage" alt="Stitched Image" />
              <p>尺寸: {{ stitchedWidth }} x {{ stitchedHeight }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const images = ref([]);
        const stitchedImage = ref('');
        const stitchedWidth = ref(0);
        const stitchedHeight = ref(0);
        
        const layout = ref({
          direction: 'horizontal',
          spacing: 10,
          alignment: 'start'
        });

        const addImage = (event) => {
          const files = Array.from(event.target.files);
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
              images.value.push({
                url: e.target.result,
                name: file.name,
                width: 0,
                height: 0
              });
              
              // 获取图片尺寸
              const img = new Image();
              img.onload = () => {
                const index = images.value.findIndex(i => i.url === e.target.result);
                if (index !== -1) {
                  images.value[index].width = img.width;
                  images.value[index].height = img.height;
                }
              };
              img.src = e.target.result;
            };
            reader.readAsDataURL(file);
          });
        };

        const removeImage = (index) => {
          images.value.splice(index, 1);
        };

        const moveImage = (index, direction) => {
          if ((direction === -1 && index === 0) || (direction === 1 && index === images.value.length - 1)) {
            return;
          }
          
          const newIndex = index + direction;
          const temp = images.value[index];
          images.value[index] = images.value[newIndex];
          images.value[newIndex] = temp;
        };

        const stitchImages = () => {
          if (images.value.length < 2) return;
          
          // 创建一个Promise数组来等待所有图片加载
          const loadPromises = images.value.map(img => {
            return new Promise(resolve => {
              const imageObj = new Image();
              imageObj.onload = () => resolve(imageObj);
              imageObj.src = img.url;
            });
          });
          
          Promise.all(loadPromises).then(imgObjects => {
            // 计算拼接后图片的尺寸
            let totalWidth = 0;
            let totalHeight = 0;
            let maxWidth = 0;
            let maxHeight = 0;
            
            if (layout.value.direction === 'horizontal') {
              // 横向拼接
              totalWidth = layout.value.spacing * (images.value.length - 1);
              imgObjects.forEach((img, index) => {
                totalWidth += img.width;
                maxHeight = Math.max(maxHeight, img.height);
              });
              totalHeight = maxHeight;
            } else {
              // 纵向拼接
              totalHeight = layout.value.spacing * (images.value.length - 1);
              imgObjects.forEach((img, index) => {
                totalHeight += img.height;
                maxWidth = Math.max(maxWidth, img.width);
              });
              totalWidth = maxWidth;
            }
            
            // 创建画布
            const canvas = document.createElement('canvas');
            canvas.width = totalWidth;
            canvas.height = totalHeight;
            const ctx = canvas.getContext('2d');
            
            // 设置背景为白色
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制图片
            let currentX = 0;
            let currentY = 0;
            
            imgObjects.forEach((img, index) => {
              if (layout.value.direction === 'horizontal') {
                // 横向拼接
                let y = 0;
                
                switch (layout.value.alignment) {
                  case 'start':
                    y = 0;
                    break;
                  case 'center':
                    y = (totalHeight - img.height) / 2;
                    break;
                  case 'end':
                    y = totalHeight - img.height;
                    break;
                  case 'stretch':
                    // 拉伸适应高度
                    ctx.drawImage(img, currentX, 0, img.width, totalHeight);
                    currentX += img.width + layout.value.spacing;
                    return;
                }
                
                ctx.drawImage(img, currentX, y, img.width, img.height);
                currentX += img.width + layout.value.spacing;
              } else {
                // 纵向拼接
                let x = 0;
                
                switch (layout.value.alignment) {
                  case 'start':
                    x = 0;
                    break;
                  case 'center':
                    x = (totalWidth - img.width) / 2;
                    break;
                  case 'end':
                    x = totalWidth - img.width;
                    break;
                  case 'stretch':
                    // 拉伸适应宽度
                    ctx.drawImage(img, 0, currentY, totalWidth, img.height);
                    currentY += img.height + layout.value.spacing;
                    return;
                }
                
                ctx.drawImage(img, x, currentY, img.width, img.height);
                currentY += img.height + layout.value.spacing;
              }
            });
            
            stitchedImage.value = canvas.toDataURL('image/jpeg', 0.9);
            stitchedWidth.value = canvas.width;
            stitchedHeight.value = canvas.height;
          });
        };

        const downloadImage = () => {
          if (!stitchedImage.value) return;
          
          const link = document.createElement('a');
          link.href = stitchedImage.value;
          link.download = 'stitched_image.jpg';
          link.click();
        };

        const resetAll = () => {
          images.value = [];
          stitchedImage.value = '';
          stitchedWidth.value = 0;
          stitchedHeight.value = 0;
        };

        return {
          images,
          stitchedImage,
          stitchedWidth,
          stitchedHeight,
          layout,
          addImage,
          removeImage,
          moveImage,
          stitchImages,
          downloadImage,
          resetAll
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
