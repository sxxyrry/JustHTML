<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片加水印 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <script src="../assets/AddHeader_Tools.js"></script>
  <script src="../assets/AddFooter.js"></script>
  <script src="../assets/AddIco.js"></script>

  <style>
    .watermark-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .control-item {
      display: flex;
      flex-direction: column;
    }
    
    .control-item label {
      margin-bottom: 5px;
      color: var(--accent-color);
    }
    
    .control-item input, .control-item select, .control-item textarea {
      padding: 8px;
    }
    
    .image-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }
    
    .image-preview {
      flex: 1;
      min-width: 300px;
      text-align: center;
    }
    
    .image-preview img {
      max-width: 100%;
      max-height: 400px;
      display: block;
      margin: 0 auto;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .position-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 15px 0;
    }
    
    .position-btn {
      padding: 10px;
      background-color: var(--bg-secondary);
      border-radius: var(--border-radius);
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .position-btn:hover {
      background-color: var(--bg-tertiary);
    }
    
    .position-btn.selected {
      background-color: var(--accent-color);
      color: white;
    }
    
    .watermark-preview {
      position: relative;
      display: inline-block;
    }
    
    .watermark-text {
      position: absolute;
      color: white;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
      pointer-events: none;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>图片加水印</h2>
        <p>为图片添加文字或图片水印</p>
        
        <div class="info-box">
          <p><strong>使用说明：</strong></p>
          <p>• 上传图片后，设置水印文字内容、位置、大小等参数</p>
          <p>• 可以选择文字水印或图片水印</p>
          <p>• 预览满意后点击"下载图片"保存</p>
        </div>
        
        <div>
          <input type="file" @change="handleImageUpload" accept="image/*" />
          
          <div class="watermark-controls">
            <div class="control-item">
              <label for="watermarkType">水印类型</label>
              <select id="watermarkType" v-model="watermarkType">
                <option value="text">文字水印</option>
                <option value="image">图片水印</option>
              </select>
            </div>
            
            <div class="control-item" v-if="watermarkType === 'text'">
              <label for="watermarkText">水印文字</label>
              <input type="text" id="watermarkText" v-model="watermark.text" placeholder="输入水印文字" />
            </div>
            
            <div class="control-item" v-if="watermarkType === 'image'">
              <label for="watermarkImage">上传水印图片</label>
              <input type="file" @change="handleWatermarkImageUpload" accept="image/*" />
            </div>
            
            <div class="control-item" v-if="watermarkType === 'text'">
              <label for="fontSize">字体大小 (px)</label>
              <input type="number" id="fontSize" v-model.number="watermark.fontSize" min="10" max="100" />
            </div>
            
            <div class="control-item">
              <label for="opacity">透明度</label>
              <input 
                type="range" 
                id="opacity" 
                v-model.number="watermark.opacity" 
                min="10" 
                max="100" 
                step="5"
              />
              <span>{{ watermark.opacity }}%</span>
            </div>
            
            <div class="control-item" v-if="watermarkType === 'text'">
              <label for="fontFamily">字体</label>
              <select id="fontFamily" v-model="watermark.fontFamily">
                <option value="Arial">Arial</option>
                <option value="Verdana">Verdana</option>
                <option value="Helvetica">Helvetica</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Courier New</option>
              </select>
            </div>
            
            <div class="control-item">
              <label for="offset">边距 (px)</label>
              <input type="number" id="offset" v-model.number="watermark.offset" min="0" max="100" />
            </div>
          </div>
          
          <div class="position-grid">
            <div 
              class="position-btn" 
              :class="{ selected: watermark.position === 'top-left' }"
              @click="setPosition('top-left')"
            >
              左上
            </div>
            <div 
              class="position-btn" 
              :class="{ selected: watermark.position === 'top-center' }"
              @click="setPosition('top-center')"
            >
              顶部居中
            </div>
            <div 
              class="position-btn" 
              :class="{ selected: watermark.position === 'top-right' }"
              @click="setPosition('top-right')"
            >
              右上
            </div>
            <div 
              class="position-btn" 
              :class="{ selected: watermark.position === 'middle-left' }"
              @click="setPosition('middle-left')"
            >
              左中
            </div>
            <div 
              class="position-btn" 
              :class="{ selected: watermark.position === 'center' }"
              @click="setPosition('center')"
            >
              居中
            </div>
            <div 
              class="position-btn" 
              :class="{ selected: watermark.position === 'middle-right' }"
              @click="setPosition('middle-right')"
            >
              右中
            </div>
            <div 
              class="position-btn" 
              :class="{ selected: watermark.position === 'bottom-left' }"
              @click="setPosition('bottom-left')"
            >
              左下
            </div>
            <div 
              class="position-btn" 
              :class="{ selected: watermark.position === 'bottom-center' }"
              @click="setPosition('bottom-center')"
            >
              底部居中
            </div>
            <div 
              class="position-btn" 
              :class="{ selected: watermark.position === 'bottom-right' }"
              @click="setPosition('bottom-right')"
            >
              右下
            </div>
          </div>
          
          <div class="controls">
            <button @click="addWatermark" :disabled="!originalImage">添加水印</button>
            <button @click="downloadImage" :disabled="!watermarkedImage">下载图片</button>
            <button @click="resetForm">重置</button>
          </div>
          
          <div class="image-container" v-if="originalImage">
            <div class="image-preview">
              <h3>原始图片</h3>
              <img :src="originalImage" alt="Original Image" />
            </div>
            
            <div class="image-preview" v-if="watermarkedImage">
              <h3>加水印后</h3>
              <img :src="watermarkedImage" alt="Watermarked Image" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const originalImage = ref('');
        const watermarkImage = ref('');
        const watermarkedImage = ref('');
        const watermarkType = ref('text');
        
        const watermark = ref({
          text: '水印',
          fontSize: 20,
          fontFamily: 'Arial',
          opacity: 50,
          position: 'bottom-right',
          offset: 20
        });

        const handleImageUpload = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = (e) => {
            originalImage.value = e.target.result;
          };
          reader.readAsDataURL(file);
        };

        const handleWatermarkImageUpload = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = (e) => {
            watermarkImage.value = e.target.result;
          };
          reader.readAsDataURL(file);
        };

        const setPosition = (position) => {
          watermark.value.position = position;
        };

        const addWatermark = () => {
          if (!originalImage.value) return;
          
          const img = new Image();
          img.onload = async () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            
            // 设置水印透明度
            const alpha = watermark.value.opacity / 100;
            
            if (watermarkType.value === 'text') {
              // 设置字体样式
              ctx.font = `${watermark.value.fontSize}px ${watermark.value.fontFamily}`;
              ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
              ctx.textAlign = 'left';
              ctx.textBaseline = 'top';
              
              // 测量文本宽度
              const textWidth = ctx.measureText(watermark.value.text).width;
              const textHeight = watermark.value.fontSize;
              
              // 计算水印位置
              let x = watermark.value.offset;
              let y = watermark.value.offset;
              
              switch (watermark.value.position) {
                case 'top-left':
                  x = watermark.value.offset;
                  y = watermark.value.offset;
                  break;
                case 'top-center':
                  x = (canvas.width - textWidth) / 2;
                  y = watermark.value.offset;
                  break;
                case 'top-right':
                  x = canvas.width - textWidth - watermark.value.offset;
                  y = watermark.value.offset;
                  break;
                case 'middle-left':
                  x = watermark.value.offset;
                  y = (canvas.height - textHeight) / 2;
                  break;
                case 'center':
                  x = (canvas.width - textWidth) / 2;
                  y = (canvas.height - textHeight) / 2;
                  break;
                case 'middle-right':
                  x = canvas.width - textWidth - watermark.value.offset;
                  y = (canvas.height - textHeight) / 2;
                  break;
                case 'bottom-left':
                  x = watermark.value.offset;
                  y = canvas.height - textHeight - watermark.value.offset;
                  break;
                case 'bottom-center':
                  x = (canvas.width - textWidth) / 2;
                  y = canvas.height - textHeight - watermark.value.offset;
                  break;
                case 'bottom-right':
                  x = canvas.width - textWidth - watermark.value.offset;
                  y = canvas.height - textHeight - watermark.value.offset;
                  break;
              }
              
              // 添加阴影效果
              ctx.shadowColor = 'black';
              ctx.shadowBlur = 2;
              ctx.shadowOffsetX = 1;
              ctx.shadowOffsetY = 1;
              
              // 绘制文字水印
              ctx.fillText(watermark.value.text, x, y);
            } else if (watermarkType.value === 'image' && watermarkImage.value) {
              const wmImg = new Image();
              wmImg.onload = () => {
                // 计算水印位置
                let x = watermark.value.offset;
                let y = watermark.value.offset;
                
                switch (watermark.value.position) {
                  case 'top-left':
                    x = watermark.value.offset;
                    y = watermark.value.offset;
                    break;
                  case 'top-center':
                    x = (canvas.width - wmImg.width) / 2;
                    y = watermark.value.offset;
                    break;
                  case 'top-right':
                    x = canvas.width - wmImg.width - watermark.value.offset;
                    y = watermark.value.offset;
                    break;
                  case 'middle-left':
                    x = watermark.value.offset;
                    y = (canvas.height - wmImg.height) / 2;
                    break;
                  case 'center':
                    x = (canvas.width - wmImg.width) / 2;
                    y = (canvas.height - wmImg.height) / 2;
                    break;
                  case 'middle-right':
                    x = canvas.width - wmImg.width - watermark.value.offset;
                    y = (canvas.height - wmImg.height) / 2;
                    break;
                  case 'bottom-left':
                    x = watermark.value.offset;
                    y = canvas.height - wmImg.height - watermark.value.offset;
                    break;
                  case 'bottom-center':
                    x = (canvas.width - wmImg.width) / 2;
                    y = canvas.height - wmImg.height - watermark.value.offset;
                    break;
                  case 'bottom-right':
                    x = canvas.width - wmImg.width - watermark.value.offset;
                    y = canvas.height - wmImg.height - watermark.value.offset;
                    break;
                }
                
                // 设置透明度
                ctx.globalAlpha = alpha;
                
                // 绘制图片水印
                ctx.drawImage(wmImg, x, y);
                
                // 重置透明度
                ctx.globalAlpha = 1.0;
                
                // 更新水印图片
                watermarkedImage.value = canvas.toDataURL('image/jpeg', 0.9);
              };
              wmImg.src = watermarkImage.value;
            } else {
              // 更新水印图片
              watermarkedImage.value = canvas.toDataURL('image/jpeg', 0.9);
            }
            
            // 如果是文字水印，直接更新
            if (watermarkType.value === 'text') {
              watermarkedImage.value = canvas.toDataURL('image/jpeg', 0.9);
            }
          };
          img.src = originalImage.value;
        };

        const downloadImage = () => {
          if (!watermarkedImage.value) return;
          
          const link = document.createElement('a');
          link.href = watermarkedImage.value;
          link.download = 'watermarked_image.jpg';
          link.click();
        };

        const resetForm = () => {
          watermark.value = {
            text: '水印',
            fontSize: 20,
            fontFamily: 'Arial',
            opacity: 50,
            position: 'bottom-right',
            offset: 20
          };
          watermarkImage.value = '';
          watermarkedImage.value = '';
        };

        return {
          originalImage,
          watermarkImage,
          watermarkedImage,
          watermark,
          watermarkType,
          handleImageUpload,
          handleWatermarkImageUpload,
          setPosition,
          addWatermark,
          downloadImage,
          resetForm
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
