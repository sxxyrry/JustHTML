<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Ipsum生成器 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <script src="../assets/AddHeader.js"></script>
  <script src="../assets/AddFooter.js"></script>

  <style>
    .generator-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    
    .option-item {
      display: flex;
      flex-direction: column;
    }
    
    .option-item label {
      margin-bottom: 5px;
      color: var(--accent-color);
    }
    
    .option-item input, .option-item select {
      padding: 8px;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
    }
    
    .output-container {
      position: relative;
      margin-top: 20px;
    }
    
    .copy-button {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>Lorem Ipsum生成器</h2>
        <p>生成占位文本用于设计和排版</p>
        
        <div class="info-box">
          <p><strong>功能说明：</strong></p>
          <p>• Lorem ipsum dolor sit amet 是常用的印刷和排版行业的虚拟文本</p>
          <p>• 用于展示视觉效果而不受文字内容干扰</p>
          <p>• 可以生成指定数量的段落或句子</p>
        </div>
        
        <div class="generator-options">
          <div class="option-item">
            <label for="outputType">输出类型</label>
            <select id="outputType" v-model="outputType">
              <option value="paragraphs">段落</option>
              <option value="sentences">句子</option>
              <option value="words">单词</option>
            </select>
          </div>
          
          <div class="option-item">
            <label for="amount">数量</label>
            <input 
              type="number" 
              id="amount" 
              v-model.number="amount" 
              min="1" 
              :max="outputType === 'paragraphs' ? 50 : 100"
            >
          </div>
          
          <div class="option-item">
            <label for="startWith">起始文本</label>
            <select id="startWith" v-model="startWith">
              <option value="true">以"Lorem ipsum"开始</option>
              <option value="false">随机开始</option>
            </select>
          </div>
        </div>
        
        <div class="controls">
          <button @click="generateText">生成文本</button>
          <button @click="copyText">复制文本</button>
          <button @click="clearText">清空</button>
        </div>
        
        <div class="output-container">
          <button class="copy-button" @click="copyText" v-if="generatedText">复制文本</button>
          <textarea 
            v-model="generatedText" 
            placeholder="生成的Lorem Ipsum文本将显示在这里..."
            rows="15"
            readonly
          ></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const outputType = ref('paragraphs');
        const amount = ref(3);
        const startWith = ref('true');
        const generatedText = ref('');
        
        // Lorem ipsum 单词库
        const loremIpsumWords = [
          'lorem', 'ipsum', 'dolor', 'sit', 'amet', 'consectetur', 
          'adipiscing', 'elit', 'sed', 'do', 'eiusmod', 'tempor', 
          'incididunt', 'ut', 'labore', 'et', 'dolore', 'magna', 
          'aliqua', 'enim', 'ad', 'minim', 'veniam', 'quis', 
          'nostrud', 'exercitation', 'ullamco', 'laboris', 'nisi', 
          'aliquip', 'ex', 'ea', 'commodo', 'consequat', 'duis', 
          'aute', 'irure', 'dolor', 'in', 'reprehenderit', 'voluptate', 
          'velit', 'esse', 'cillum', 'dolore', 'eu', 'fugiat', 
          'nulla', 'pariatur', 'excepteur', 'sint', 'occaecat', 
          'cupidatat', 'non', 'proident', 'sunt', 'culpa', 'qui', 
          'officia', 'deserunt', 'mollit', 'anim', 'id', 'est', 
          'laborum', 'phasellus', 'vestibulum', 'facilisis', 'mauris', 
          'pellentesque', 'pulvinar', 'habitant', 'morbi', 'tristique', 
          'senectus', 'netus', 'malesuada', 'fames', 'turpis', 
          'egestas', 'elementum', 'tincidunt', 'sapien', 'risus', 
          'odio', 'nunc', 'purus', 'nisl', 'suscipit', 'adipiscing', 
          'bibendum', 'imperdiet', 'phasellus', 'sollicitudin', 
          'nibh', 'congue', 'curabitur', 'lectus', 'porta', 'vitae'
        ];
        
        // 生成句子
        const generateSentence = (isFirst = false) => {
          const wordCount = Math.floor(Math.random() * 10) + 8; // 8-17个词
          let words = [];
          
          if (isFirst && startWith.value === 'true') {
            words = ['Lorem', 'ipsum'];
            // 添加更多词
            for (let i = 2; i < wordCount; i++) {
              const randomWord = 
                loremIpsumWords[Math.floor(Math.random() * loremIpsumWords.length)];
              words.push(capitalizeFirst(randomWord));
            }
          } else {
            for (let i = 0; i < wordCount; i++) {
              const randomWord = 
                loremIpsumWords[Math.floor(Math.random() * loremIpsumWords.length)];
              words.push(i === 0 ? capitalizeFirst(randomWord) : randomWord);
            }
          }
          
          // 随机添加逗号
          for (let i = 2; i < words.length - 2; i++) {
            if (Math.random() > 0.7 && !words[i].endsWith(',')) {
              words[i] += ',';
            }
          }
          
          return words.join(' ') + '.';
        };
        
        // 首字母大写
        const capitalizeFirst = (str) => {
          return str.charAt(0).toUpperCase() + str.slice(1);
        };
        
        // 生成文本
        const generateText = () => {
          let result = [];
          
          if (outputType.value === 'paragraphs') {
            for (let i = 0; i < amount.value; i++) {
              const sentenceCount = Math.floor(Math.random() * 4) + 3; // 3-6个句子
              let paragraph = '';
              
              for (let j = 0; j < sentenceCount; j++) {
                paragraph += generateSentence(i === 0 && j === 0) + ' ';
              }
              
              result.push(paragraph.trim());
            }
          } else if (outputType.value === 'sentences') {
            for (let i = 0; i < amount.value; i++) {
              result.push(generateSentence(i === 0));
            }
          } else { // words
            const allWords = [];
            for (let i = 0; i < amount.value; i++) {
              const randomWord = 
                loremIpsumWords[Math.floor(Math.random() * loremIpsumWords.length)];
              allWords.push(i === 0 && startWith.value === 'true' ? 'Lorem' : randomWord);
            }
            result.push(allWords.join(' '));
          }
          
          generatedText.value = outputType.value === 'paragraphs' 
            ? result.join('\n\n') 
            : result.join(' ');
        };
        
        // 复制文本
        const copyText = async () => {
          if (!generatedText.value) {
            alert('没有可复制的文本');
            return;
          }
          
          try {
            await navigator.clipboard.writeText(generatedText.value);
            alert('文本已复制到剪贴板！');
          } catch (err) {
            console.error('复制失败:', err);
            alert('复制失败');
          }
        };
        
        // 清空文本
        const clearText = () => {
          generatedText.value = '';
        };
        
        return {
          outputType,
          amount,
          startWith,
          generatedText,
          generateText,
          copyText,
          clearText
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
