<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽签工具 - JustHTML 只需网页</title>
  <script>
/**
 * 动态加载（强制去除缓存） CSS 的函数
 * @param {string} src - 要加载的 CSS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadStyle(src) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    link.async = true;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}

/**
 * 动态加载（强制去除缓存） JS 的函数
 * @param {string} src - 要加载的 JS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    script.async = true;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}
</script>

  <script>
    loadStyle('../assets/style.css')
    let scriptArray = [
      "../assets/AddHeader_Tools.js",
      "../assets/AddFooter.js",
      "../assets/AddIco.js",
      "../assets/AutoRun.js",
    ]

    scriptArray.forEach(script => {
      loadScript(script);
    });
  </script>

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <style>
    .lottery-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .lottery-box {
      position: relative;
      width: 300px;
      height: 400px;
      background: linear-gradient(145deg, #2d2d2d, #1e1e1e);
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      margin: 30px auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .lottery-lid {
      position: absolute;
      top: -30px;
      width: 320px;
      height: 30px;
      background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
      border-radius: 10px 10px 0 0;
      cursor: pointer;
    }
    
    .lottery-content {
      padding: 20px;
      text-align: center;
    }
    
    .ticket {
      background-color: #f8f9fa;
      color: #333;
      padding: 15px;
      border-radius: 8px;
      margin: 10px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .result-display {
      font-size: 1.5em;
      font-weight: bold;
      text-align: center;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      padding: 15px;
      background-color: var(--bg-tertiary);
      border-radius: var(--border-radius);
      min-width: 300px;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
      justify-content: center;
    }
    
    .info-box {
      background-color: var(--bg-tertiary);
      padding: 10px;
      border-radius: var(--border-radius);
      margin: 10px 0;
      text-align: center;
    }
    
    .history-box {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
    }
    
    .history-item {
      padding: 10px;
      background-color: var(--bg-secondary);
      border-radius: var(--border-radius);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    
    .lottery-animation {
      animation: flip 0.6s ease-in-out;
    }
    
    @keyframes flip {
      0% { transform: rotateY(0); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }
    
    .draw-btn {
      background: linear-gradient(45deg, #ff6b6b, #ffa500);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1.2em;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: all 0.3s;
    }
    
    .draw-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }
    
    .draw-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>抽签工具</h2>
        <p>模拟传统抽签过程，用于决定顺序或选择</p>
        
        <div class="info-box">
          <p><strong>使用说明：</strong></p>
          <p>添加多个选项，点击"开始抽签"按钮进行随机抽取</p>
        </div>
        
        <div class="lottery-container">
          <div class="lottery-box">
            <div class="lottery-lid" @click="toggleLid"></div>
            <div class="lottery-content">
              <div v-if="tickets.length === 0" class="ticket">
                <p>请先添加签条</p>
              </div>
              <div v-else>
                <div v-for="(ticket, index) in tickets" :key="index" class="ticket">
                  <p>{{ ticket }}</p>
                </div>
              </div>
            </div>
          </div>
          
          <div>
            <textarea 
              v-model="newTicket" 
              placeholder="输入签条内容，每行一个..."
              rows="4"
              style="width: 100%; max-width: 500px;"
            ></textarea>
            
            <div class="controls">
              <button @click="addTickets">添加签条</button>
              <button @click="clearTickets">清空签条</button>
            </div>
          </div>
          
          <button class="draw-btn" @click="drawTicket" :disabled="tickets.length === 0">开始抽签</button>
          
          <div class="result-display" :class="{ 'lottery-animation': isAnimating }">
            <span v-if="drawnTicket">{{ drawnTicket }}</span>
            <span v-else>等待抽签...</span>
          </div>
          
          <div class="history-box" v-if="history.length > 0">
            <h3>抽签历史</h3>
            <div v-for="(record, index) in history" :key="index" class="history-item">
              <span>{{ record.time }} - {{ record.ticket }}</span>
              <button @click="removeHistory(index)">删除</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const tickets = ref([]);
        const newTicket = ref('');
        const drawnTicket = ref('');
        const history = ref([]);
        const isLidOpen = ref(false);
        const isAnimating = ref(false);
        
        const addTickets = () => {
          if (!newTicket.value.trim()) {
            alert('请输入签条内容');
            return;
          }
          
          const ticketList = newTicket.value
            .split('\n')
            .map(ticket => ticket.trim())
            .filter(ticket => ticket !== '');
          
          tickets.value.push(...ticketList);
          newTicket.value = '';
        };
        
        const drawTicket = () => {
          if (tickets.value.length === 0) {
            alert('请先添加至少一个签条');
            return;
          }
          
          // 动画效果
          isAnimating.value = true;
          
          // 模拟抽奖动画
          let counter = 0;
          const maxIterations = 20;
          const interval = setInterval(() => {
            const randomIndex = Math.floor(Math.random() * tickets.value.length);
            drawnTicket.value = tickets.value[randomIndex];
            counter++;
            
            if (counter >= maxIterations) {
              clearInterval(interval);
              
              // 最终结果
              const finalIndex = Math.floor(Math.random() * tickets.value.length);
              drawnTicket.value = tickets.value[finalIndex];
              
              // 添加到历史记录
              history.value.unshift({
                time: new Date().toLocaleString(),
                ticket: drawnTicket.value
              });
              
              // 重置动画状态
              setTimeout(() => {
                isAnimating.value = false;
              }, 300);
            }
          }, 100);
        };
        
        const clearTickets = () => {
          if (confirm('确定要清空所有签条吗？')) {
            tickets.value = [];
            drawnTicket.value = '';
          }
        };
        
        const toggleLid = () => {
          isLidOpen.value = !isLidOpen.value;
        };
        
        const removeHistory = (index) => {
          history.value.splice(index, 1);
        };
        
        return {
          tickets,
          newTicket,
          drawnTicket,
          history,
          isLidOpen,
          isAnimating,
          addTickets,
          drawTicket,
          clearTickets,
          toggleLid,
          removeHistory
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
