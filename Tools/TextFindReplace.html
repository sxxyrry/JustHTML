<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本查找替换 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <script src="../assets/AddHeader.js"></script>
  <script src="../assets/AddFooter.js"></script>

  <style>
    .find-replace-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0;
    }
    
    @media (max-width: 768px) {
      .find-replace-container {
        grid-template-columns: 1fr;
      }
    }
    
    .input-group {
      margin-bottom: 15px;
    }
    
    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--accent-color);
    }
    
    .options-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin: 15px 0;
    }
    
    .option-item {
      display: flex;
      align-items: center;
    }
    
    .option-item input {
      margin-right: 5px;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    
    .result-stats {
      margin-top: 15px;
      padding: 10px;
      background-color: var(--bg-tertiary);
      border-radius: var(--border-radius);
    }
    
    .highlight {
      background-color: yellow;
      color: black;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>文本查找替换</h2>
        <p>在文本中查找并替换指定内容</p>
        
        <div>
          <div class="input-group">
            <label for="searchText">查找内容</label>
            <input 
              type="text" 
              id="searchText" 
              v-model="searchText" 
              placeholder="输入要查找的文本"
            >
          </div>
          
          <div class="input-group">
            <label for="replaceText">替换为</label>
            <input 
              type="text" 
              id="replaceText" 
              v-model="replaceText" 
              placeholder="输入替换的文本"
            >
          </div>
          
          <div class="options-container">
            <div class="option-item">
              <input type="checkbox" id="caseSensitive" v-model="options.caseSensitive">
              <label for="caseSensitive">区分大小写</label>
            </div>
            
            <div class="option-item">
              <input type="checkbox" id="wholeWord" v-model="options.wholeWord">
              <label for="wholeWord">全词匹配</label>
            </div>
            
            <div class="option-item">
              <input type="checkbox" id="useRegex" v-model="options.useRegex">
              <label for="useRegex">使用正则表达式</label>
            </div>
          </div>
          
          <div class="controls">
            <button @click="findAndReplace">查找并替换</button>
            <button @click="replaceAll">全部替换</button>
            <button @click="findNext">查找下一个</button>
            <button @click="highlightMatches">高亮匹配项</button>
            <button @click="clearHighlights">清除高亮</button>
            <button @click="clearAll">清空所有</button>
          </div>
          
          <div class="input-group">
            <label for="originalText">原文本</label>
            <textarea 
              id="originalText" 
              v-model="originalText" 
              placeholder="在此输入要处理的文本..."
              rows="10"
            ></textarea>
          </div>
          
          <div class="input-group">
            <label for="resultText">处理结果</label>
            <textarea 
              id="resultText" 
              v-model="resultText" 
              placeholder="处理后的文本将显示在这里..."
              rows="10"
              readonly
            ></textarea>
          </div>
          
          <div class="result-stats" v-if="matchCount > 0">
            <p>找到 <strong>{{ matchCount }}</strong> 个匹配项</p>
            <p v-if="currentMatchIndex >= 0">当前位置: 第 <strong>{{ currentMatchIndex + 1 }}</strong> 个匹配项</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, watch } = Vue;

    createApp({
      setup() {
        const originalText = ref('');
        const resultText = ref('');
        const searchText = ref('');
        const replaceText = ref('');
        const matchCount = ref(0);
        const currentMatchIndex = ref(-1);
        const options = ref({
          caseSensitive: false,
          wholeWord: false,
          useRegex: false
        });
        
        const findAndReplace = () => {
          if (!searchText.value) {
            alert('请输入要查找的内容');
            return;
          }
          
          resultText.value = originalText.value;
          calculateMatches();
        };
        
        const replaceAll = () => {
          if (!searchText.value) {
            alert('请输入要查找的内容');
            return;
          }
          
          if (options.value.useRegex) {
            try {
              const flags = options.value.caseSensitive ? 'g' : 'gi';
              const regex = new RegExp(searchText.value, flags);
              resultText.value = originalText.value.replace(regex, replaceText.value);
            } catch (e) {
              alert('正则表达式错误: ' + e.message);
              return;
            }
          } else {
            let text = originalText.value;
            const searchStr = searchText.value;
            
            if (options.value.caseSensitive) {
              if (options.value.wholeWord) {
                // 全词匹配，区分大小写
                const regex = new RegExp(`\\b${searchStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'g');
                resultText.value = text.replace(regex, replaceText.value);
              } else {
                // 不区分词界，区分大小写
                const regex = new RegExp(searchStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
                resultText.value = text.replace(regex, replaceText.value);
              }
            } else {
              if (options.value.wholeWord) {
                // 全词匹配，不区分大小写
                const regex = new RegExp(`\\b${searchStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'gi');
                resultText.value = text.replace(regex, replaceText.value);
              } else {
                // 不区分词界，不区分大小写
                const regex = new RegExp(searchStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                resultText.value = text.replace(regex, replaceText.value);
              }
            }
          }
          
          calculateMatches();
        };
        
        const findNext = () => {
          if (!searchText.value) {
            alert('请输入要查找的内容');
            return;
          }
          
          calculateMatches();
          
          if (matchCount.value === 0) {
            alert('没有找到匹配项');
            return;
          }
          
          // 简化的查找下一个功能
          const text = originalText.value;
          const searchStr = searchText.value;
          let startIndex = 0;
          
          if (currentMatchIndex.value >= 0) {
            // 从当前位置之后开始查找
            startIndex = text.indexOf(searchStr, 
              text.indexOf(searchStr, 0) + (currentMatchIndex.value * searchStr.length));
            startIndex = startIndex + searchStr.length;
          }
          
          let foundIndex = -1;
          if (options.value.caseSensitive) {
            foundIndex = text.indexOf(searchStr, startIndex);
          } else {
            foundIndex = text.toLowerCase().indexOf(searchStr.toLowerCase(), startIndex);
          }
          
          if (foundIndex !== -1) {
            currentMatchIndex.value = currentMatchIndex.value < matchCount.value - 1 ? 
              currentMatchIndex.value + 1 : 0;
          } else {
            // 如果没找到，则从头开始找
            if (startIndex > 0) {
              if (options.value.caseSensitive) {
                foundIndex = text.indexOf(searchStr, 0);
              } else {
                foundIndex = text.toLowerCase().indexOf(searchStr.toLowerCase(), 0);
              }
              if (foundIndex !== -1) {
                currentMatchIndex.value = 0;
              }
            }
          }
        };
        
        const calculateMatches = () => {
          if (!searchText.value) {
            matchCount.value = 0;
            return;
          }
          
          if (options.value.useRegex) {
            try {
              const flags = options.value.caseSensitive ? 'g' : 'gi';
              const regex = new RegExp(searchText.value, flags);
              const matches = originalText.value.match(regex);
              matchCount.value = matches ? matches.length : 0;
            } catch (e) {
              matchCount.value = 0;
            }
          } else {
            const searchStr = searchText.value;
            let text = originalText.value;
            
            if (options.value.caseSensitive) {
              if (options.value.wholeWord) {
                const regex = new RegExp(`\\b${searchStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'g');
                const matches = text.match(regex);
                matchCount.value = matches ? matches.length : 0;
              } else {
                const regex = new RegExp(searchStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
                const matches = text.match(regex);
                matchCount.value = matches ? matches.length : 0;
              }
            } else {
              if (options.value.wholeWord) {
                const regex = new RegExp(`\\b${searchStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'gi');
                const matches = text.match(regex);
                matchCount.value = matches ? matches.length : 0;
              } else {
                const regex = new RegExp(searchStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                const matches = text.match(regex);
                matchCount.value = matches ? matches.length : 0;
              }
            }
          }
        };
        
        const highlightMatches = () => {
          if (!searchText.value) {
            alert('请输入要查找的内容');
            return;
          }
          
          alert("此功能需要额外的文本高亮逻辑，由于实现复杂，在此简化版本中暂不实现");
        };
        
        const clearHighlights = () => {
          alert("此功能需要额外的文本高亮逻辑，由于实现复杂，在此简化版本中暂不实现");
        };
        
        const clearAll = () => {
          originalText.value = '';
          resultText.value = '';
          searchText.value = '';
          replaceText.value = '';
          matchCount.value = 0;
          currentMatchIndex.value = -1;
        };
        
        // 监听原文本变化，自动重新计算匹配数
        watch(originalText, () => {
          if (searchText.value) {
            calculateMatches();
          }
        });
        
        // 监听搜索选项变化，自动重新计算匹配数
        watch(options, () => {
          if (searchText.value) {
            calculateMatches();
          }
        }, { deep: true });
        
        return {
          originalText,
          resultText,
          searchText,
          replaceText,
          matchCount,
          currentMatchIndex,
          options,
          findAndReplace,
          replaceAll,
          findNext,
          highlightMatches,
          clearHighlights,
          clearAll
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
