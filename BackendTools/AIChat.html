<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> AI 聊天 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">

  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>

  <script src="../assets/AddHeader.js"></script>
  <script src="../assets/AddFooter.js"></script>

  <style>
    .tips {
      margin-top: 5px;
      color: var(--text-secondary);
      font-size: 1.125rem;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 600px;
      max-width: 900px;
      margin: 20px auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .chat-header {
      background-color: var(--bg-secondary);
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background-color: var(--bg-primary);
    }

    .message {
      margin-bottom: 20px;
      padding: 10px 15px;
      border-radius: 8px;
      max-width: 80%;
    }

    .user-message {
      background-color: var(--primary-color);
      color: white;
      margin-left: auto;
      text-align: right;
    }

    .ai-message {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
    }

    .chat-input-area {
      padding: 15px;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      resize: vertical;
    }

    button {
      padding: 10px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .config-panel {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background-color: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .config-item {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      box-sizing: border-box;
    }
    
    .developer-config {
      background-color: rgba(255, 182, 193, 0.1);
      padding: 10px;
      border-radius: 4px;
      border: 1px dashed #ccc;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-connected {
      background-color: #4caf50;
    }

    .status-disconnected {
      background-color: #f44336;
    }

    .typing-indicator {
      color: var(--text-secondary);
      font-style: italic;
      padding: 10px 15px;
    }

    .note {
      background-color: #3a3d42;
      border-left: 4px solid #ad8305;
      padding: 10px;
      margin: 10px 0;
      border-radius: 0 4px 4px 0;
    }

    .note * {
      font-weight: bold;
      font-size: larger;
      color: #b9b8b2;
    }

    input {
      background-color: #3a3d42;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>AI 聊天</h2>
        
        <div class="note">
          <p><strong>注意：</strong>本功能因为只有 FreeQWQ 的后端稳定支持，<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;但是 FreeQWQ 服务端出现错误，所以暂时无法使用本服务的默认服务商！</p>
        </div>
        
        <!-- 配置面板 -->
        <div class="config-panel" :class="{ hidden: isConfigHidden }">
          <h3>AI 聊天配置</h3>
          
          <!-- 开发者模式开关 -->
          <div class="config-item">
            <label>
              <input 
                type="checkbox" 
                v-model="developerMode" 
                @change="toggleDeveloperMode"
              >
              开启开发者模式
            </label>
          </div>
          
          <!-- 开发者模式配置区域 -->
          <div v-if="developerMode" class="developer-config">
            <div class="config-item">
              <label for="customApiUrl">自定义API URL:</label>
              <input 
                type="text" 
                id="customApiUrl" 
                v-model="customApiUrl" 
                placeholder="请输入自定义API URL"
              >
            </div>
            
            <div class="config-item">
              <label for="customApiKey">自定义API密钥:</label>
              <input 
                type="password" 
                id="customApiKey" 
                v-model="customApiKey" 
                placeholder="请输入自定义API密钥"
              >
            </div>
            
            <div class="config-item">
              <label for="customModel">自定义模型:</label>
              <input 
                type="text" 
                id="customModel" 
                v-model="customModel" 
                placeholder="请输入模型名称，例如: gpt-3.5-turbo"
              >
            </div>
            
            <hr style="margin: 15px 0;">
          </div>
          
          <!-- 普通模式配置区域（开发者模式关闭时显示） -->
          <div v-if="!developerMode">
            <div class="config-item">
              <label for="providerSelect">选择服务商:</label>
              <select id="providerSelect" v-model="selectedProvider" @change="onProviderChange">
                <option value="">请选择服务商</option>
                <option v-for="provider in presetConfigs" :key="provider.name" :value="provider.name">
                  {{ provider.name }}
                </option>
              </select>
            </div>
            
            <div class="config-item" v-if="selectedProvider && modelOptions.length > 0">
              <label for="modelSelect">选择模型:</label>
              <select id="modelSelect" v-model="selectedModel" @change="onModelChange">
                <option value="">请选择模型</option>
                <option v-for="modelObj in modelOptions" :key="modelObj.name" :value="modelObj.name">
                  {{ modelObj.name }}
                </option>
              </select>
            </div>
          </div>
          
          <div class="config-item">
            <label for="temperature">温度 (Temperature):</label>
            <input 
              type="range" 
              id="temperature" 
              v-model.number="temperature" 
              min="0" 
              max="2" 
              step="0.01"
              style="width: 100%;"
            >
            <div>{{ temperature }} (数值越高越随机)</div>
          </div>
          
          <div class="config-item">
            <label for="maxTokens">最大Token数:</label>
            <input 
              type="number" 
              id="maxTokens" 
              v-model.number="maxTokens" 
              min="1" 
              max="4096"
              placeholder="最大生成token数量"
            >
          </div>
          
          <div class="config-item">
            <label for="topP">Top P:</label>
            <input 
              type="number" 
              id="topP" 
              v-model.number="topP" 
              min="0" 
              max="1" 
              step="0.01"
              placeholder="核采样参数"
            >
          </div>
          
          <button @click="saveConfig">保存配置</button>
          
          <div style="margin-top: 10px;">
            <span :class="['status-indicator', connectionStatus]"></span>
            <span>{{ connectionStatusText }}</span>
          </div>
        </div>
        
        <!-- 切换配置显示/隐藏按钮 -->
        <div style="text-align: center; margin: 10px 0;">
          <button @click="toggleConfig">{{ isConfigHidden ? '显示配置' : '隐藏配置' }}</button>
        </div>
        
        <!-- 聊天界面 -->
        <div class="chat-container">
          <div class="chat-header">
            <h3>AI 助手</h3>
            <div>
              <span :class="['status-indicator', connectionStatus]"></span>
              <span>{{ connectionStatusText }}</span>
            </div>
          </div>
          
          <div class="chat-messages" ref="messagesContainer">
            <div 
              v-for="(msg, index) in messages" 
              :key="index" 
              :class="['message', msg.role === 'user' ? 'user-message' : 'ai-message']"
            >
              <strong>{{ msg.role === 'user' ? '你:' : 'AI:' }}</strong>
              <div>{{ msg.content }}</div>
            </div>
            
            <div v-if="isLoading" class="typing-indicator">
              AI 正在思考中...
            </div>
          </div>
          
          <div class="chat-input-area">
            <div class="input-row">
              <textarea 
                v-model="inputMessage" 
                placeholder="输入消息..." 
                @keydown.enter.exact.prevent="sendMessage"
                :disabled="isLoading"
              ></textarea>
            </div>
            
            <div>
              <button @click="sendMessage" :disabled="isLoading || !inputMessage.trim()">
                发送
              </button>
              <button @click="clearChat" style="margin-left: 10px;">清空对话</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted, nextTick, computed } = Vue;

    createApp({
      setup() {
        // 配置相关
        const apiUrl = ref('');
        const apiKey = ref('');
        const model = ref('');
        const temperature = ref(0.7);
        const maxTokens = ref(2048);
        const topP = ref(1.0);
        const isConfigHidden = ref(false);
        const developerMode = ref(false);  // 新增：开发者模式状态
        
        // 开发者自定义配置
        const customApiUrl = ref('');
        const customApiKey = ref('');
        const customModel = ref('');
        
        // 预设配置选项
        const presetConfigs = [
          {
            name: 'FreeQWQ',
            apiUrl: 'https://api.suanli.cn/v1/chat/completions',
            apiKey: 'sk-W0rpStc95T7JVYVwDYc29IyirjtpPPby6SozFMQr17m8KWeo', // 替换为实际的API Key
            models: [
              { name: 'free:Qwen3-30B-A3B', default: true },
            ]
          },
        ];
        
        const selectedProvider = ref('');
        const selectedModel = ref('');
        
        // 聊天相关
        const messages = ref([]);
        const inputMessage = ref('');
        const isLoading = ref(false);
        const connectionStatus = ref('status-disconnected');
        const connectionStatusText = ref('未连接');
        const messagesContainer = ref(null);
        
        // 从本地存储加载配置
        onMounted(() => {
          // 加载开发者模式状态
          const savedDevMode = localStorage.getItem('ai_chat_developer_mode') === 'true';
          developerMode.value = savedDevMode;
          
          if (developerMode.value) {
            // 加载开发者自定义配置
            customApiUrl.value = localStorage.getItem('ai_chat_custom_api_url') || '';
            customApiKey.value = localStorage.getItem('ai_chat_custom_api_key') || '';
            customModel.value = localStorage.getItem('ai_chat_custom_model') || '';
            
            // 使用自定义配置
            apiUrl.value = customApiUrl.value;
            apiKey.value = customApiKey.value;
            model.value = customModel.value;
          } else {
            // 加载普通模式配置
            selectedProvider.value = localStorage.getItem('ai_chat_selected_provider') || '';
            selectedModel.value = localStorage.getItem('ai_chat_selected_model') || '';
            
            if (selectedProvider.value) {
              onProviderChange();
            }
          }
          
          // 加载其他参数
          temperature.value = parseFloat(localStorage.getItem('ai_chat_temperature') || '0.7');
          maxTokens.value = parseInt(localStorage.getItem('ai_chat_max_tokens') || '2048');
          topP.value = parseFloat(localStorage.getItem('ai_chat_top_p') || '1.0');
        });
        
        // 获取当前选中提供商的模型选项
        const modelOptions = computed(() => {
          if (!selectedProvider.value) return [];
          const provider = presetConfigs.find(p => p.name === selectedProvider.value);
          return provider ? provider.models : [];
        });
        
        // 当选择服务商时
        const onProviderChange = () => {
          const provider = presetConfigs.find(p => p.name === selectedProvider.value);
          if (provider) {
            apiUrl.value = provider.apiUrl;
            apiKey.value = provider.apiKey; // 使用内置的API Key
            
            // 设置默认模型
            const defaultModel = provider.models.find(m => m.default);
            if (defaultModel) {
              selectedModel.value = defaultModel.name;
              model.value = defaultModel.name;
            } else {
              selectedModel.value = '';
              model.value = '';
            }
          }
          updateConnectionStatus();
        };
        
        // 当选择模型时
        const onModelChange = () => {
          model.value = selectedModel.value;
        };
        
        // 切换开发者模式
        const toggleDeveloperMode = () => {
          if (developerMode.value) {
            // 进入开发者模式，使用自定义配置
            apiUrl.value = customApiUrl.value;
            apiKey.value = customApiKey.value;
            model.value = customModel.value;
          } else {
            // 退出开发者模式，恢复预设配置
            onProviderChange(); // 重新设置当前选择的服务商配置
          }
          updateConnectionStatus();
        };
        
        // 保存配置到本地存储
        const saveConfig = () => {
          if (developerMode.value) {
            // 保存开发者自定义配置
            localStorage.setItem('ai_chat_custom_api_url', customApiUrl.value);
            localStorage.setItem('ai_chat_custom_api_key', customApiKey.value);
            localStorage.setItem('ai_chat_custom_model', customModel.value);
          } else {
            // 保存普通模式配置
            localStorage.setItem('ai_chat_selected_provider', selectedProvider.value);
            localStorage.setItem('ai_chat_selected_model', selectedModel.value);
          }
          
          // 保存开发者模式状态和其他参数
          localStorage.setItem('ai_chat_developer_mode', developerMode.value.toString());
          localStorage.setItem('ai_chat_temperature', temperature.value.toString());
          localStorage.setItem('ai_chat_max_tokens', maxTokens.value.toString());
          localStorage.setItem('ai_chat_top_p', topP.value.toString());
          
          alert('配置已保存！');
          updateConnectionStatus();
        };
        
        // 更新连接状态
        const updateConnectionStatus = () => {
          if ((developerMode.value && customApiUrl.value && customApiKey.value && customModel.value) || 
              (!developerMode.value && selectedProvider.value && apiKey.value && selectedModel.value)) {
            connectionStatus.value = 'status-connected';
            connectionStatusText.value = '已连接';
          } else {
            connectionStatus.value = 'status-disconnected';
            connectionStatusText.value = '未连接';
          }
        };

        window.updateConnectionStatus = updateConnectionStatus
        
        // 切换配置面板显示/隐藏
        const toggleConfig = () => {
          isConfigHidden.value = !isConfigHidden.value;
        };
        
        // 发送消息
        const sendMessage = async () => {
          if (!inputMessage.value.trim()) return;
          
          // 添加用户消息
          const userMsg = {
            role: 'user',
            content: inputMessage.value
          };
          messages.value.push(userMsg);
          const messageToSend = inputMessage.value;
          inputMessage.value = '';
          
          // 添加一个空白的AI消息占位符
          const aiMsg = {
            role: 'assistant',
            content: ''
          };
          messages.value.push(aiMsg);
          currentAiMessageIndex = messages.value.length - 1; // 记录当前AI消息索引
          
          isLoading.value = true;

          try {
            // 使用真实的API调用（流式）
            const response = await callRealApi(messageToSend);
            
            // // 暂时使用模拟数据进行测试
            // const response = await callAiApi(messageToSend);
            
            // 最终设置完整的响应内容
            messages.value[currentAiMessageIndex].content = response;
          } catch (error) {
            // 如果出错，更新AI消息为错误信息
            if (currentAiMessageIndex >= 0) {
              messages.value[currentAiMessageIndex].content = `错误: ${error.message}`;
            }
          } finally {
            isLoading.value = false;
            currentAiMessageIndex = -1; // 重置索引
            
            // 自动滚动到底部
            await nextTick();
            scrollToBottom();
          }
        };
        
        // 当前AI消息索引
        let currentAiMessageIndex = -1;
        
        // 辅助函数：更新当前AI消息的显示内容
        const updateCurrentAiMessage = (content) => {
          if (currentAiMessageIndex >= 0) {
            // 更新现有的AI消息内容
            messages.value[currentAiMessageIndex].content = content;
            
            // 自动滚动到底部
            nextTick(() => {
              scrollToBottom();
            });
          }
        };

        // 真实的API调用函数 - 流式输出实现
        const callRealApi = async (message) => {
          if (!apiUrl.value || !apiKey.value || !model.value) {
            throw new Error('请先配置API参数');
          }

          // 将消息历史加入请求
          const fullMessages = [
            ...messages.value.filter(msg => msg.role !== 'assistant'), // 不包括当前这次AI回复
            { role: 'user', content: message }
          ];

          try {
            // 真实的API请求 - 流式输出
            const response = await fetch(apiUrl.value, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey.value}`
              },
              body: JSON.stringify({
                model: model.value,
                messages: fullMessages,
                stream: true,
                temperature: temperature.value,
                max_tokens: maxTokens.value,
                top_p: topP.value
              })
            });

            if (!response.ok) {
              const errorData = await response.text();
              throw new Error(`API请求失败: ${response.status} - ${errorData}`);
            }

            // 检查是否支持流式响应
            if (!response.body) {
              throw new Error('服务器不支持流式响应');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let accumulatedResponse = '';

            // 创建一个Promise来处理完整的流式响应
            return new Promise((resolve, reject) => {
              const processStream = async () => {
                try {
                  while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) {
                      resolve(accumulatedResponse);
                      break;
                    }

                    // 解码数据块
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                      if (line.startsWith('data: ')) {
                        const data = line.slice(6); // 移除 "data: " 前缀
                        
                        // 检查是否是结束标记
                        if (data === '[DONE]') {
                          resolve(accumulatedResponse);
                          return;
                        }

                        try {
                          const parsed = JSON.parse(data);
                          
                          // 处理OpenAI格式的数据
                          if (parsed.choices && parsed.choices[0]) {
                            const choice = parsed.choices[0];
                            
                            // 检查是否有delta字段（流式数据）
                            if (choice.delta && choice.delta.content) {
                              const content = choice.delta.content;
                              accumulatedResponse += content;
                              
                              // 实时更新AI消息内容
                              updateCurrentAiMessage(accumulatedResponse);
                            } 
                            // 或者检查message字段（完整数据）
                            else if (choice.message && choice.message.content) {
                              const content = choice.message.content;
                              accumulatedResponse += content;
                              
                              // 实时更新AI消息内容
                              updateCurrentAiMessage(accumulatedResponse);
                            }
                          }
                        } catch (e) {
                          // 忽略无法解析的JSON数据
                          console.warn('无法解析的数据:', data);
                        }
                      }
                    }
                  }
                } catch (error) {
                  reject(error);
                } finally {
                  reader.releaseLock();
                }
              };

              processStream();
            });
          } catch (error) {
            throw error;
          }
        };
        
        // 模拟API调用函数 - 保留现有模拟功能用于测试
        const callAiApi = async (message) => {
          // 模拟网络延迟
          await new Promise(resolve => setTimeout(resolve, 1000));
          
          // 模拟逐步输出效果
          const words = [`这是对 "${message}" 的`, '模拟响', '应。实', '际部', '署时会', '调用真', '实API。'];
          for (let i = 0; i < words.length; i++) {
            await new Promise(resolve => setTimeout(resolve, 300)); // 每次延迟300毫秒
            const partialResponse = words.slice(0, i + 1).join('');
            updateCurrentAiMessage(partialResponse);
          }
          
          // 返回完整响应
          return `这是对 "${message}" 的模拟响应。实际部署时会调用真实API。`;
        };
        
        // 清空聊天记录
        const clearChat = () => {
          if (confirm('确定要清空聊天记录吗？')) {
            messages.value = [];
          }
        };
        
        // 滚动到底部
        const scrollToBottom = () => {
          if (messagesContainer.value) {
            messagesContainer.value.scrollTop = messagesContainer.value.scrollHeight;
          }
        };
        
        // 监听消息变化，自动滚动
        const watchMessages = () => {
          // 在实际Vue 3应用中，这将是响应式的
        };
        
        return {
          apiUrl,
          apiKey,
          model,
          temperature,
          maxTokens,
          topP,
          customApiUrl,
          customApiKey,
          customModel,
          selectedProvider,
          selectedModel,
          presetConfigs,
          modelOptions,
          developerMode,
          isConfigHidden,
          messages,
          inputMessage,
          isLoading,
          connectionStatus,
          connectionStatusText,
          messagesContainer,
          saveConfig,
          toggleConfig,
          sendMessage,
          clearChat,
          onProviderChange,
          onModelChange,
          toggleDeveloperMode
        };
      }
    }).mount('#app');

    function updated() {
      setTimeout(updated, 1000);
      if (window.updateConnectionStatus) {
        updateConnectionStatus()
      }
    }

    updated()
  </script>
</body>
</html>
