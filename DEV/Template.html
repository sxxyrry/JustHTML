<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具名称 - JustHTML 只需网页</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../package/Vue/code/vue.global.prod.js"></script>
  <script type="module" src="../package/Sober/code/main.js"></script>
</head>
<body>
  <div id="app">
    <div class="container">
      <a href="../index.html" class="back-link">← 返回首页</a>
      
      <div class="tool-section">
        <h2>工具标题</h2>
        
        <!-- 工具主体内容 -->
        <div>
          <!-- 示例：输入区域 -->
          <textarea v-model="inputText" placeholder="在这里输入内容..."></textarea>
          
          <!-- 示例：按钮 -->
          <button @click="processData">处理</button>
          
          <!-- 示例：输出区域 -->
          <div class="result" v-if="result">
            {{ result }}
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const inputText = ref('');
        const result = ref('');

        const processData = () => {
          // 实现工具逻辑
          result.value = inputText.value; // 示例逻辑
        };

        return {
          inputText,
          result,
          processData
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
