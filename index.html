  <meta charset="UTF-8">

  <script>
/**
 * 动态加载（强制去除缓存） JS 的函数
 * @param {string} src - 要加载的 JS 的 src 链接
 * @returns {Promise} 返回一个 Promise 对象，用于处理异步加载
 */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src + '?v=' + new Date().getTime(); // 使用时间戳避免缓存
    script.async = true;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

/**
 * URL安全的Base64编码器
 * 将输入字符串转换为URL安全的Base64编码格式
 * @param {string} input - 要编码的字符串
 * @returns {string} URL安全的Base64编码字符串
 */
function urlSafeBase64Encode(input) {
    // 首先使用标准btoa进行Base64编码
    const base64 = btoa(encodeURIComponent(input).replace(/%([0-9A-F]{2})/g, function(match, p1) {
        return String.fromCharCode('0x' + p1);
    }));
    
    // 替换不安全的字符为URL安全的字符
    return base64
        .replace(/\+/g, '-')  // 将 '+' 替换为 '-'
        .replace(/\//g, '_')  // 将 '/' 替换为 '_'
        .replace(/=/g, '');   // 移除填充字符 '='
}

/**
 * URL安全的Base64解码器
 * 将URL安全的Base64编码字符串解码回原始字符串
 * @param {string} input - URL安全的Base64编码字符串
 * @returns {string} 解码后的原始字符串
 */
function urlSafeBase64Decode(input) {
    // 先将URL安全的字符转换回标准Base64字符
    let base64 = input
        .replace(/-/g, '+')  // 将 '-' 替换为 '+'
        .replace(/_/g, '/'); // 将 '_' 替换为 '/'
    
    // 根据需要添加填充字符
    const padding = base64.length % 4;
    if (padding !== 0) {
        base64 += '='.repeat(4 - padding);
    }
    
    // 使用atob解码
    return decodeURIComponent(Array.prototype.map.call(atob(base64), function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
}
</script>

  <script src="./assets/AddFooter.js"></script>

  <style>
    .search-container {
      margin: 20px auto;
      max-width: 600px;
    }

    .search-box {
      width: 100%;
      padding: 12px 20px;
      border-radius: var(--border-radius);
      border: 1px solid var(--bg-tertiary);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 16px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .category {
      background-color: var(--bg-secondary);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .category h2 {
      color: var(--accent-color);
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--bg-tertiary);
    }

    .tools-list {
      list-style: none;
    }

    .tools-list li {
      padding: 8px 0;
      border-bottom: 1px solid var(--bg-tertiary);
    }

    .tools-list li:last-child {
      border-bottom: none;
    }

    .tool-link {
      color: var(--text-primary);
      text-decoration: none;
      display: block;
      transition: var(--transition);
      padding: 5px 10px;
      border-radius: 4px;
    }

    .tool-link:hover {
      background-color: var(--bg-tertiary);
      color: var(--accent-color);
    }

    .highlight {
      background-color: rgba(74, 158, 255, 0.2);
    }

    .subcategory-title {
      font-weight: bold;
      color: #6c757d;
      margin-top: 15px;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px dashed var(--bg-tertiary);
    }

    .no-results {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px;
      grid-column: 1 / -1;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="container">
      <button onclick="showVHDialog()"> 版本历史记录 </button>

      <button onclick="showREDialog()"> README 文件 </button>

      <div class="search-container">
        <input type="text" id="searchBox" v-model="searchQuery" class="search-box" placeholder="搜索工具...">
      </div>

      <div ref="cate" class="categories">
        <!-- 使用 Vue v-for 循环生成工具分类 -->
        <div v-for="(category, catIndex) in filteredCategories" :key="catIndex" class="category"
          v-show="category.totalTools > 0">
          <h2>{{ category.title }}</h2>
          <ul class="tools-list">
            <!-- 遍历每个分类下的子项目 -->
            <template v-for="item in category.items">
              <!-- 如果子项目有 items 数组，说明是分组结构 -->
              <template v-if="item.items">
                <li class="subcategory-title">{{ item.name }}</li>
                <li v-for="subItem in item.items" :key="subItem.link"
                  :class="{ highlight: isHighlighted(subItem.content) }">
                  <a :href="subItem.link" class="tool-link">
                    {{ subItem.content.replace(/^[^-]* - /, '') }}
                  </a>
                </li>
              </template>

              <!-- 如果子项目直接有 link 和 content，说明是单个工具 -->
              <li v-else :key="item.link" :class="{ highlight: isHighlighted(item.content) }">
                <a :href="item.link" class="tool-link">
                  {{ item.content.replace(/^[^-]* - /, '') }}
                </a>
              </li>
            </template>
          </ul>
        </div>

        <!-- 显示无结果提示 -->
        <div v-if="!loading && ToolsData.length === 0" class="no-results">
          <p>没有获取到工具</p>
        </div>

        <!-- 显示无结果提示 -->
        <div v-if="!loading && searchQuery !== '' && filteredCategories.length === 0" class="no-results">
          <p>没有找到匹配的工具</p>
        </div>

        <!-- 添加加载状态 -->
        <div v-if="loading && searchQuery === ''" class="no-results">
          <p>加载中...</p>
        </div>
      </div>

      <script>
        
      </script>

    </div>
  </div>

  <dialog id="VersionHistoryDialog">
    <div class="dialog-content">
      <h2>版本历史</h2>
      <pre id="VersionHistory"></pre>
      <div class="dialog-actions">
        <button class="btn" id="closeDialog_VerHis">关闭</button>
      </div>
    </div>
  </dialog>
  <dialog id="READMEDialog">
    <div class="dialog-content">
      <h2>README</h2>
      <pre id="README"></pre>
      <div class="dialog-actions">
        <button class="btn" id="closeDialog_README">关闭</button>
      </div>
    </div>
  </dialog>

  <h1 id="wait">请等待</h1>

  <script>
    window.addEventListener('click', (e) => {
      e.preventDefault()

      if (e.target.nodeName === 'A') {
        if (e.target.href.startsWith(window.location.origin)) {
          const relativePath = './' + e.target.href.substring(window.location.origin.length + '/JustHTML/'.length);

          console.log(relativePath)

          if (window.Tools.includes(relativePath)) {
            window.open(e.target.href, '_self');
            return
          }
          const url = e.target.href
          if (url.endsWith('.md') || url.endsWith('.Md') || url.endsWith('.mD') || url.endsWith('.MD')) {
            fetch(url)
              .then(response => response.text())
              .then(text => {
                const encodedURL = urlSafeBase64Encode(text)
                const url_ = `/showMD.html?content=${encodedURL}`
                window.open(url_)
              })
          } else if (url.endsWith('/package/Marked/LICENSE')) {
            fetch(url)
              .then(response => response.text())
              .then(text => {
                const encodedURL = urlSafeBase64Encode(text)
                const url_ = `/showMD.html?content=${encodedURL}`
                window.open(url_)
              })
          } else {
            fetch(url)
              .then(response => response.text())
              .then(text => {
                const encodedURL = urlSafeBase64Encode(text)
                const url_ = `/showFile.html?content=${encodedURL}`
                window.open(url_)
              })
          }
        } else if (e.target.href.endsWith('.md') || e.target.href.endsWith('.Md') || e.target.href.endsWith('.mD') || e.target.href.endsWith('.MD')) {
            fetch(url)
              .then(response => response.text())
              .then(text => {
                const encodedURL = urlSafeBase64Encode(text)
                const url_ = `/showMD.html?content=${encodedURL}`
                window.open(url_)
              })
        } else {
          window.open(e.target.href);
        }
      }
    })

    document.addEventListener('DOMContentLoaded', () => {
      var dialog = document.getElementById('VersionHistoryDialog');
      var closeDialogBtn = document.getElementById('closeDialog_VerHis');
      
      // 添加打开对话框的方法到 全局 中
      showVHDialog = function() {
        dialog.showModal();
      };

      window.showVHDialog = showVHDialog
      
      // 关闭对话框事件
      closeDialogBtn.addEventListener('click', () => {
        dialog.close();
      });
      
      // 点击对话框外部关闭对话框
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) {
          dialog.close();
        }
      });
    });
    document.addEventListener('DOMContentLoaded', () => {
      var dialog = document.getElementById('READMEDialog');
      var closeDialogBtn = document.getElementById('closeDialog_README');
      
      // 添加打开对话框的方法到 全局 中
      showREDialog = function() {
        dialog.showModal();
      };
      window.showREDialog = showREDialog
      
      // 添加打开对话框的方法到 Vue 应用中
      if (window.vueApp) {
        window.vueApp.showREDialog = function() {
          const dialog_info = document.getElementById('infoDialog');
          if (dialog_info) {
            dialog_info.close();
          }
          dialog.showModal();
        };
      }
      
      // 关闭对话框事件
      closeDialogBtn.addEventListener('click', () => {
        dialog.close();
      });
      
      // 点击对话框外部关闭对话框
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) {
          dialog.close();
        }
      });
    });
    const { onMounted, createApp, ref, computed } = Vue;

    const cate = ref()
    let App = null;

    // 创建一个延迟加载的函数
    function initApp() {
      App = createApp({
        setup() {
          // 初始化搜索查询
          const searchQuery = ref('');
          const loading = ref(true);
          const isSearching = ref(false);

          // 获取工具数据并处理
          const toolsData = window.ToolsData || [];

          // 如果工具数据不存在，返回空数组
          if (!toolsData || toolsData.length === 0) {
            loading.value = false;
            return {
              searchQuery,
              loading,
              isSearching,
              filteredCategories: computed(() => []),
              isHighlighted: () => false,
              ToolsData: toolsData,
            };
          }

          // 将原始数据转换为包含总工具数的对象
          const processedToolsData = toolsData.map(category => {
            let totalTools = 0;

            const itemsWithCounts = category.items.map(item => {
              if (item.items) {
                // 分组项目
                totalTools += item.items.length;
                return {
                  ...item,
                  count: item.items.length
                };
              } else {
                // 单个项目
                totalTools++;
                return item;
              }
            });

            return {
              ...category,
              items: itemsWithCounts,
              totalTools: totalTools
            };
          });

          // 计算属性：根据搜索词过滤工具
          const filteredCategories = computed(() => {
            if (!searchQuery.value.trim()) {
              return processedToolsData;
            }

            const query = searchQuery.value.toLowerCase();

            return processedToolsData.map(category => {
              let totalTools = 0;

              const filteredItems = category.items.flatMap(item => {
                if (item.items) {
                  // 处理分组项目
                  const filteredSubItems = item.items.filter(subItem =>
                    subItem.content.toLowerCase().includes(query)
                  );

                  if (filteredSubItems.length > 0) {
                    totalTools += filteredSubItems.length;
                    
                    return [{
                      ...item,
                      items: filteredSubItems
                    }];
                  }
                } else {
                  // 处理单个项目
                  if (
                    item.content.toLowerCase().includes(query)
                  ) {
                    totalTools++;
                    return [item];
                  }
                }

                return [];
              });

              return {
                ...category,
                items: filteredItems,
                totalTools: totalTools
              };
            }).filter(category => category.totalTools > 0); // 只显示有匹配工具的分类
          });

          // 判断工具名称是否高亮显示
          const isHighlighted = (toolContent) => {
            if (!searchQuery.value.trim()) {
              return false;
            }

            return toolContent.toLowerCase().includes(searchQuery.value.toLowerCase());
          };

          loading.value = false;

          return {
            searchQuery,
            loading,
            isSearching,
            filteredCategories,
            isHighlighted,
            ToolsData: toolsData,
          };
        }
      })
      window.vueApp = App
      App.mount('#app');
    }

    document.getElementById('app').style.opacity = '0';
    document.getElementById('wait').style.opacity = '1';

    // 等待所有脚本加载完成后初始化应用
    Promise.all([
      loadScript('./assets/Tools.js'),
      loadScript('./assets/ToolsData.js')
    ])
    .then(() => {
      // 复制数据
      window.ToolsData = deepcopy(ToolsData);
      window.Tools = [];

      function extractLinks(data) {
        data.forEach(category => {
          if (category.items && Array.isArray(category.items)) {
            category.items.forEach(item => {
              if (item.items && Array.isArray(item.items)) {
                // 存在嵌套的items，遍历内部items
                item.items.forEach(subItem => {
                  if (subItem.link) {
                    window.Tools.push(subItem.link);
                  }
                });
              } else {
                // 直接在items中有link
                if (item.link) {
                  window.Tools.push(item.link);
                }
              }
            });
          }
        });
      }

      extractLinks(window.ToolsData);

      // 等待README和VersionHistory加载完成
      return Promise.all([
        fetch('./README.md?timestamp=' + Date.now())
          .then(rep => rep.text())
          .then(text => {
            document.getElementById('README').innerHTML = marked.parse(text);
          }),
        fetch('./VersionHistory.txt?timestamp=' + Date.now())
          .then(rep => rep.text())
          .then(text => {
            document.getElementById('VersionHistory').innerHTML = text;
          })
      ]);
    })
    .then(() => {
      document.getElementById('app').style.opacity = '1';
      document.getElementById('wait').style.display = 'none';
      // 初始化应用
      setTimeout(initApp, 0); // 稍微延时确保数据可用
    })
    .catch(error => {
      console.error('脚本加载失败:', error);
    });
    // initApp();
  </script>
</body>

</html>
